<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<title>새싹이의 농막</title>
<link rel="icon" type="image/png" href="{{ICON64}}">
<style>{{STYLE}}</style>
</head>
<body>
<div id="welcome" class="welcome" hidden>
  <div class="welcome-card">
    <img class="wordmark" src="{{WORDMARK}}" alt="새싹이의 농막">
    <p class="lead">농촌진흥청 마크다운 편집기</p>
    <div class="welcome-actions">
      <button id="w-new" class="tile"><span class="tile-t">새 문서</span><span class="tile-s">빈 문서로 시작</span><kbd>Ctrl+N</kbd></button>
      <button id="w-file" class="tile"><span class="tile-t">파일 열기</span><span class="tile-s">.md 문서 하나</span><kbd>Ctrl+O</kbd></button>
      <button id="w-folder" class="tile"><span class="tile-t">폴더 열기</span><span class="tile-s">문서 묶음 전체</span></button>
    </div>
    <button id="w-last" class="link-btn" hidden></button>
    <p id="w-note" class="note">폴더를 열면 그 안의 문서가 왼쪽 목록에 나오고, 고친 내용은 바로 저장됩니다.<br>이 프로그램은 인터넷에 연결하지 않습니다.</p>
  </div>
</div>

<div id="app" class="app" hidden>
  <aside class="side">
    <div class="brand"><img src="{{ICON64}}" alt=""><span>새싹이의 농막</span><button id="btn-side-close" class="icon-btn chevron" title="목록 닫기">‹</button></div>
    <div class="side-head">
      <span id="rootname" class="rootname"></span>
      <button id="btn-folder" class="icon-btn" title="다른 폴더 열기">폴더 바꾸기</button>
    </div>
    <input id="search" class="search" type="search" placeholder="제목·본문 찾기" autocomplete="off">
    <div class="side-actions">
      <button id="btn-new" class="btn small">＋ 새 페이지</button>
      <button id="btn-newdir" class="btn small ghost">＋ 폴더</button>
    </div>
    <nav id="tree" class="tree"></nav>
  </aside>
  <main class="main">
    <div class="toolbar">
      <button id="btn-side" class="icon-btn hamburger" title="문서 목록 열기·닫기" aria-label="문서 목록"><span></span><span></span><span></span></button>
      <div class="menu-wrap">
        <button id="btn-file" class="menu-btn">파일 ▾</button>
        <div id="filemenu" class="menu" hidden>
          <button id="m-new">새 문서<kbd>Ctrl+N</kbd></button>
          <button id="m-open">열기…<kbd>Ctrl+O</kbd></button>
          <button id="m-folder">폴더 열기…</button>
          <hr>
          <button id="m-save">저장<kbd>Ctrl+S</kbd></button>
          <button id="m-saveas">다른 이름으로 저장…<kbd>Ctrl+Shift+S</kbd></button>
          <hr>
          <button id="m-hwpx">한글(hwpx)로 내보내기…</button>
          <button id="m-pdf">PDF로 내보내기…</button>
          <hr>
          <button id="m-print">인쇄…<kbd>Ctrl+P</kbd></button>
        </div>
      </div>
      <div class="title"><span id="crumb" class="crumb"></span><span id="pagename" class="pagename"></span></div>
      <span class="mode" role="group" aria-label="편집 모드"><button id="mode-rich" class="on" title="서식 도구로 고치기(노션처럼)">편집기</button><button id="mode-raw" title="문서 전체를 마크다운 원문으로 보기·고치기">원문</button></span>
      <button id="btn-rename" class="icon-btn" title="이름 바꾸기">이름 바꾸기</button>
      <button id="btn-delete" class="icon-btn" title="이 문서 지우기">지우기</button>
      <button id="btn-theme" class="icon-btn" title="밝게 / 어둡게">어둡게</button>
    </div>
    <div id="fmt" class="fmt">
      <select id="f-block" title="블록 종류">
        <option value="p">본문</option><option value="h1">제목 1</option><option value="h2">제목 2</option><option value="h3">제목 3</option>
        <option value="blockquote">인용</option><option value="code">코드</option>
      </select>
      <span class="fmt-sep"></span>
      <button data-cmd="bold" title="굵게 (Ctrl+B)"><b>가</b></button>
      <button data-cmd="italic" title="기울임 (Ctrl+I)"><i>가</i></button>
      <button data-cmd="underline" title="밑줄 (Ctrl+U)"><u>가</u></button>
      <button data-cmd="strikeThrough" title="취소선"><s>가</s></button>
      <span class="fmt-sep"></span>
      <select id="f-font" title="글꼴"><option value="">글꼴</option></select>
      <select id="f-size" title="글자 크기"><option value="">크기</option></select>
      <span class="fmt-sep"></span>
      <span class="pal-wrap"><button id="f-color" title="글자색"><span class="a">가</span><span id="f-color-sw" class="swatch"></span></button><div id="pal-color" class="pal" hidden></div></span>
      <span class="pal-wrap"><button id="f-bg" title="형광펜"><span class="a hl">가</span><span id="f-bg-sw" class="swatch"></span></button><div id="pal-bg" class="pal" hidden></div></span>
      <span class="fmt-sep"></span>
      <button data-cmd="insertUnorderedList" title="글머리 목록">• 목록</button>
      <button data-cmd="insertOrderedList" title="번호 목록">1. 목록</button>
      <button id="f-task" title="할 일 상자">☑ 할 일</button>
      <span class="fmt-sep"></span>
      <button id="f-table" title="표 넣기">▦ 표</button>
      <span id="f-tablebar" class="fmt-group" hidden>
        <button id="f-row-add" title="아래에 줄 더하기">줄＋</button><button id="f-col-add" title="오른쪽에 칸 더하기">칸＋</button>
        <button id="f-row-del" title="이 줄 지우기">줄－</button><button id="f-col-del" title="이 칸 열 지우기">칸－</button>
      </span>
      <button id="f-image" title="그림 넣기">그림</button>
      <button id="f-link" title="링크 걸기">링크</button>
      <button id="f-break" title="여기서 다음 쪽으로">쪽 나누기</button>
      <span class="fmt-gap"></span>
      <button id="f-clear" title="선택한 글의 꾸밈을 모두 지우기">서식 지우기</button>
      <input id="f-image-file" type="file" accept="image/png,image/jpeg,image/gif,image/webp" hidden>
    </div>
    <div class="desk">
      <div id="empty-state" class="empty-page">
        <img src="{{ICON192}}" alt="">
        <p>왼쪽에서 문서를 고르거나 <b>＋ 새 페이지</b>를 만드세요.</p>
      </div>
      <div id="page" hidden>
        <div id="doc" class="doc pages"></div>
        <div id="raw-wrap" class="raw-wrap" hidden><textarea id="raw" class="raw" spellcheck="false"></textarea></div>
      </div>
    </div>
    <footer class="statusbar">
      <span id="status" class="status">준비</span>
      <span class="sb-gap"></span>
      <span class="sb-hint">/ 블록 넣기 · Shift+Enter 줄바꿈 · Esc 편집 끝 · Ctrl+휠 확대</span>
      <span id="pages" class="count"></span>
      <span id="count" class="count"></span>
      <span class="zoom"><button id="zoom-out" class="icon-btn" title="축소">－</button><button id="zoom-val" class="icon-btn" title="100%로">100%</button><button id="zoom-in" class="icon-btn" title="확대">＋</button></span>
    </footer>
  </main>
</div>
<div id="slash" class="slash" hidden></div>
<script>{{SCRIPT}}</script>
</body>
</html>
