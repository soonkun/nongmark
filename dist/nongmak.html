/* 새싹이의 농막 - 색은 로고에서: 지붕 초록, 문 진초록, 새싹 연두, 벽 크림, 마루 나무색 */
:root {
  --green: #1f7a42; --green-d: #165a31; --leaf: #3e9c5c; --green-soft: #e3f0e4;
  --cream: #f8f3e7; --wall: #fbf8f0; --wood: #e7d9bb; --wood-d: #cdb98f;
  --paper: #ffffff; --desk: #f1ece0; --ink: #2a2a25; --muted: #7a7466; --line: #e6dfcd; --hover: #efe8d6;
  --code: #f4f0e6; --code-ink: #b4472d; --sel: #eef6ec; --shadow: 0 1px 2px rgba(60, 50, 20, .06), 0 6px 24px rgba(60, 50, 20, .07);
  --note: #e8f2f6; --tip: #e7f3e6; --important: #f1ecf7; --warning: #fbf2dc; --caution: #fbe9e6;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --green: #5fbf7f; --green-d: #8fd6a3; --leaf: #5fbf7f; --green-soft: #22352a;
  --cream: #1d1f1b; --wall: #232521; --wood: #3a3a32; --wood-d: #55523f;
  --paper: #262824; --desk: #1b1c19; --ink: #e8e6df; --muted: #a29d8f; --line: #34362f; --hover: #2f312b;
  --code: #30322c; --code-ink: #f0a68e; --sel: #263325; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 24px rgba(0,0,0,.25);
  --note: #213039; --tip: #223527; --important: #2d2836; --warning: #3a3322; --caution: #3d2624;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--desk); color: var(--ink); }
body { font: 15.5px/1.7 "Malgun Gothic", "맑은 고딕", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
kbd { font: 11px/1 "Consolas", monospace; color: var(--muted); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 2px 5px; background: var(--paper); }

.btn { border: 1px solid var(--green); background: var(--green); color: #fff; border-radius: 7px; padding: 7px 14px; cursor: pointer; font-weight: 600; }
.btn:hover { background: var(--green-d); }
.btn.small { padding: 4px 10px; font-size: 13px; }
.btn.ghost { background: transparent; color: var(--green); border-color: var(--wood-d); }
.btn.ghost:hover { background: var(--hover); }
.icon-btn { border: 0; background: none; border-radius: 6px; padding: 4px 9px; font-size: 13px; color: var(--muted); cursor: pointer; white-space: nowrap; }
.icon-btn:hover, .icon-btn.on { background: var(--hover); color: var(--ink); }
#btn-pages { display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; } #btn-pages.on { color: var(--green-d); background: var(--green-soft); }
.link-btn { border: 0; background: none; color: var(--green); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 14px; }

/* 편집 화면: 탭 줄 / 메뉴 줄 / (도구 막대 + 책상) / 상태 줄. 대문(.app.home)이면 탭 줄 아래가 대문 하나 */
.app { display: grid; grid-template-rows: auto auto 1fr auto; height: 100%; }
.app.home { grid-template-rows: auto 1fr; }
.app.home .menubar, .app.home .body, .app.home .statusbar { display: none; }
/* 저장할지 묻는 작은 대화상자 */
.ask-back { position: fixed; inset: 0; z-index: 60; background: rgba(40, 36, 20, .28); display: grid; place-items: center; }
.ask { width: min(440px, 92vw); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px 22px 18px; }
.ask-msg { margin: 0 0 18px; font-size: 15px; line-height: 1.6; word-break: keep-all; }
.ask-row { display: flex; gap: 8px; justify-content: flex-end; }
/* 시작 화면 - 농막 벽처럼 세로 판자 결 */
.welcome { display: grid; place-items: center; padding: 32px 20px;
  background: repeating-linear-gradient(90deg, var(--wall) 0 118px, var(--line) 118px 119px) , var(--wall); }
.welcome-card { width: min(640px, 100%); text-align: center; background: var(--paper); border: 1px solid var(--line); border-radius: 18px;
  padding: 36px 36px 28px; box-shadow: var(--shadow); border-bottom: 6px solid var(--wood); }
.wordmark { width: min(360px, 80%); height: auto; display: block; margin: 0 auto 4px; }
.lead { margin: 0 0 24px; color: var(--muted); letter-spacing: .02em; }
.welcome-actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
.tile { display: grid; gap: 2px; justify-items: start; text-align: left; padding: 14px 14px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--wall); cursor: pointer; position: relative; }
.tile:hover { border-color: var(--leaf); background: var(--green-soft); }
.tile-t { font-weight: 700; color: var(--green-d); font-size: 15.5px; }
.tile-s { font-size: 12.5px; color: var(--muted); }
.tile kbd { position: absolute; top: 12px; right: 10px; }
.note { color: var(--muted); font-size: 12.5px; margin: 16px 0 0; line-height: 1.6; }
.recent { text-align: left; margin-top: 4px; }
.recent-title { font-size: 12.5px; color: var(--muted); margin: 0 4px 4px; }
.recent button { display: flex; width: 100%; gap: 10px; align-items: baseline; border: 0; background: none; padding: 6px 10px; border-radius: 8px; cursor: pointer; font-size: 14px; text-align: left; }
.recent button:hover { background: var(--green-soft); }
.recent .r-name { font-weight: 600; color: var(--green-d); white-space: nowrap; }
.recent .r-path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 12px; direction: rtl; text-align: left; }

/* 탭 줄이 곧 창의 제목 줄이다(프로그램 창에는 시스템 제목 줄이 없다): 빈 곳을 끌면 창이 움직이고, 오른쪽 끝에 최소화·최대화·닫기 */
.tabs { display: flex; align-items: flex-end; gap: 2px; padding: 6px 0 0 8px; background: var(--cream); border-bottom: 1px solid var(--line); min-height: 40px; position: relative; }
.tabs-drag { flex: 1; align-self: stretch; min-width: 40px; }
.wincmd { display: flex; align-self: flex-start; margin-top: -6px; }
.wincmd button { width: 46px; height: 32px; border: 0; background: none; color: var(--ink); cursor: default; display: inline-flex; align-items: center; justify-content: center; }
.wincmd button:hover { background: var(--hover); } #win-close:hover { background: #c42b1c; color: #fff; }
.resize-top { position: fixed; left: 0; right: 0; top: 0; height: 5px; z-index: 50; cursor: ns-resize; }
.app.maximized .resize-top { display: none; }
.tab { display: flex; align-items: center; gap: 6px; max-width: 240px; min-width: 0; padding: 6px 6px 7px 12px; margin-bottom: -1px; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0; font-size: 13px; color: var(--muted); cursor: default; user-select: none; }
.tab:hover { background: var(--hover); }
.tab.on { background: var(--paper); border-color: var(--line); color: var(--ink); font-weight: 600; }
.tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-dot { display: none; font-size: 8px; color: var(--leaf); } .tab-dot.show { display: inline; }
.tab-x { border: 0; background: none; border-radius: 5px; width: 20px; height: 20px; padding: 0; line-height: 1; font-size: 15px; color: var(--muted); cursor: pointer; opacity: 0; }
.tab:hover .tab-x, .tab.on .tab-x { opacity: 1; } .tab-x:hover { background: var(--wood); color: var(--ink); }
.tab-add { border: 0; background: none; border-radius: 6px; width: 28px; height: 28px; margin-bottom: 4px; font-size: 16px; color: var(--muted); cursor: pointer; }
.tab-add:hover { background: var(--hover); color: var(--green); }
.menubar { display: flex; align-items: center; gap: 4px; padding: 5px 10px; background: var(--paper); border-bottom: 1px solid var(--line); }
.docpath { flex: 1; min-width: 0; margin-left: 10px; font-size: 12.5px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hamburger { display: inline-flex; flex-direction: column; justify-content: center; gap: 3px; width: 32px; height: 30px; padding: 0 8px; }
.hamburger span { display: block; height: 2px; border-radius: 1px; background: var(--muted); }
.hamburger:hover span, .hamburger.on span { background: var(--green); }
.body { display: grid; grid-template-columns: 48px 1fr; min-height: 0; transition: grid-template-columns .2s ease; }
.app.rail-open .body { grid-template-columns: 184px 1fr; }
/* 왼쪽 도구 막대: 접으면 아이콘만, 펴면 이름도. 설명 상자(.pop)는 오른쪽으로 펼쳐진다 */
.rail { background: var(--cream); border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 0; padding: 6px 5px; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.rail.off { opacity: .35; pointer-events: none; }
.rail hr { border: 0; border-top: 1px solid var(--wood); margin: 3px 6px; flex: none; }
.rb-wrap { position: relative; }
.rb { display: flex; align-items: center; gap: 10px; width: 100%; flex: none; border: 1px solid transparent; border-radius: 7px; padding: 4px 6px; background: none; color: var(--ink); font-size: 13px; cursor: pointer; white-space: nowrap; text-align: left; }
.rb:hover { background: var(--hover); }
.rb:disabled { opacity: .35; cursor: default; } .rb:disabled:hover { background: none; }
.rb.on { background: var(--green-soft); border-color: var(--leaf); color: var(--green-d); }
.rb .ic { width: 22px; height: 20px; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; line-height: 1; color: var(--ink); }
.rb .lb { display: none; overflow: hidden; text-overflow: ellipsis; }
.app.rail-open .rb .lb { display: inline; }
.rail-group { display: flex; flex-direction: column; gap: 1px; border-left: 2px solid var(--leaf); margin-left: 4px; padding-left: 2px; }
.rail-group .rb .ic { font-size: 11.5px; letter-spacing: -.02em; }
.ic-font { font-family: "Times New Roman", serif; font-size: 15px; }
.ic-size { font-family: "Times New Roman", serif; font-size: 15px; } .ic-size small { font-size: 9px; }
.ic-col { display: inline-flex; flex-direction: column; align-items: center; }
.ic-col .a { line-height: 1; } .ic-col .a.hl { background: #ffff00; padding: 0 2px; border-radius: 2px; color: #000; }
.swatch { display: block; width: 18px; height: 3px; margin-top: 2px; border-radius: 2px; background: #000; }
.pop { position: fixed; z-index: 25; min-width: 150px; max-height: 360px; overflow: auto; padding: 5px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); }
.pop .pi { display: flex; width: 100%; justify-content: space-between; align-items: center; gap: 12px; border: 0; background: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 13.5px; text-align: left; white-space: nowrap; }
.pop .pi:hover, .pop .pi.on { background: var(--green-soft); }
.pop .pi small { color: var(--muted); font-size: 11px; }
.pal { display: grid; grid-template-columns: repeat(6, 22px); gap: 4px; padding: 8px; min-width: 0; }
.pal button { width: 22px; height: 22px; padding: 0; border: 1px solid rgba(0,0,0,.15); border-radius: 5px; cursor: pointer; }
.pal button.none { grid-column: 1 / -1; width: auto; height: auto; padding: 3px 6px; font-size: 12px; color: var(--muted); border-color: var(--line); background: none; }
.mode { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; margin-right: 4px; }
.mode button { border: 0; background: var(--wall); padding: 4px 11px; font-size: 13px; color: var(--muted); cursor: pointer; }
.mode button.on { background: var(--green-soft); color: var(--green-d); font-weight: 700; }

.menu-wrap { position: relative; }
.menu-btn { border: 1px solid var(--line); background: var(--wall); border-radius: 7px; padding: 4px 12px; cursor: pointer; font-size: 13px; font-weight: 600; }
.menu-btn:hover, .menu-btn.on { border-color: var(--leaf); color: var(--green-d); }
.menu { position: absolute; z-index: 20; top: calc(100% + 6px); left: 0; width: 260px; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; }
.menu button { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 0; background: none; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-size: 13.5px; text-align: left; }
.menu button:hover { background: var(--green-soft); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 6px; }

.desk { overflow: auto; min-height: 0; min-width: 0; padding: 24px 20px 40px; }
/* 쪽: A4 210×297mm, 여백 좌우 20mm·위아래 30mm. 글자 크기는 pt로(한글 내보내기와 같은 11pt). 작게 확대하면 여러 쪽이 나란히. */
.pages { display: flex; flex-wrap: wrap; justify-content: center; align-content: flex-start; gap: 24px; }
.sheet { position: relative; width: 210mm; min-height: 297mm; padding: 30mm 20mm; background: var(--paper); border: 1px solid var(--line); box-shadow: var(--shadow); flex: none; }
.sheet-body { position: relative; height: 237mm; font-size: 11pt; line-height: 1.6; }
.sheet-no { position: absolute; left: 0; right: 0; bottom: 12mm; text-align: center; font-size: 9pt; color: var(--muted); }
.pagebreak { margin: 10px 0; border-top: 1px dashed var(--wood-d); text-align: center; height: 0; }
.pagebreak span { position: relative; top: -.8em; background: var(--paper); color: var(--muted); font-size: 8.5pt; padding: 0 8px; }
.raw-wrap { width: 210mm; margin: 0 auto; }
.editors { position: relative; }
.print-doc { position: absolute; left: -10000px; top: 0; width: 210mm; }
.preview { cursor: zoom-in; } .preview .sheet { cursor: zoom-in; } /* 인쇄용 쪽은 화면 밖에서 그려 두었다가 인쇄할 때만 보인다 */
.zoom { display: inline-flex; align-items: center; }
.zoom .icon-btn { padding: 0 6px; font-size: 12px; }

/* 저장할지 묻는 작은 대화상자 */
.ask-back { position: fixed; inset: 0; z-index: 60; background: rgba(40, 36, 20, .28); display: grid; place-items: center; }
.ask { width: min(440px, 92vw); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); padding: 22px 22px 18px; }
.ask-msg { margin: 0 0 18px; font-size: 15px; line-height: 1.6; word-break: keep-all; }
.ask-row { display: flex; gap: 8px; justify-content: flex-end; }
.statusbar { display: flex; align-items: center; gap: 14px; padding: 4px 14px; font-size: 12px; color: var(--muted); background: var(--cream); border-top: 1px solid var(--line); }
.sb-gap { flex: 1; }
.status.ok { color: var(--green); }
.status.error { color: #c0392b; font-weight: 600; }
.sb-hint { opacity: .8; }

/* 블록 */
.block { position: relative; border-radius: 5px; padding: 1px 8px; margin: 0 -8px; cursor: text; }
.block:hover { background: color-mix(in srgb, var(--hover) 55%, transparent); }
.block.editing { background: none; box-shadow: inset 3px 0 0 var(--green-soft); }
.block-body[contenteditable] { outline: none; min-height: 1.4em; }
.block-body[contenteditable]:empty { min-height: 1.7em; }
.block-body[contenteditable]:empty::before { content: attr(data-placeholder); color: var(--muted); pointer-events: none; }
.block.cont { cursor: default; }
.block.cont .block-add { display: none; }
.block-add { position: absolute; left: -30px; top: 5px; width: 22px; height: 22px; border: 0; border-radius: 5px; background: none; color: var(--wood-d); opacity: 0; cursor: pointer; line-height: 1; font-size: 18px; }
.block:hover .block-add { opacity: 1; }
.block-add:hover { background: var(--green-soft); color: var(--green); }
.block-edit { display: block; width: 100%; border: 1px solid var(--leaf); border-radius: 6px; background: var(--sel); color: var(--ink); resize: none; overflow: hidden; padding: 7px 9px; margin: 2px 0;
  font: 14px/1.65 "D2Coding", "Consolas", "Malgun Gothic", monospace; outline: none; box-shadow: 0 0 0 3px var(--green-soft); }
.placeholder { color: var(--muted); min-height: 1.6em; margin: 4px 0; }
.raw { width: 100%; min-height: 60vh; border: 1px solid var(--line); border-radius: 6px; padding: 14px; background: var(--wall); color: var(--ink); resize: vertical;
  font: 14px/1.65 "D2Coding", "Consolas", "Malgun Gothic", monospace; }

/* 본문 */
.doc { word-break: keep-all; overflow-wrap: anywhere; color: var(--ink); }
.doc .block { cursor: text; }
.doc h1 { font-size: 2.05em; line-height: 1.25; margin: .2em 0 .35em; letter-spacing: -.02em; color: var(--ink); }
.doc h1:first-child { padding-bottom: .35em; border-bottom: 2px solid var(--green-soft); }
.doc h2 { font-size: 1.45em; line-height: 1.3; margin: 1.1em 0 .25em; letter-spacing: -.01em; }
.doc h2::before { content: ""; display: inline-block; width: 6px; height: .9em; margin-right: 9px; border-radius: 2px; background: var(--leaf); vertical-align: -1px; }
.doc h3 { font-size: 1.2em; margin: .9em 0 .2em; }
.doc h4, .doc h5, .doc h6 { font-size: 1.03em; margin: .8em 0 .2em; color: var(--muted); }
.doc p { margin: 5px 0; min-height: 1.4em; }
.doc ul, .doc ol { margin: 5px 0; padding-left: 1.6em; }
.doc li { margin: 2px 0; }
.doc li::marker { color: var(--leaf); }
.doc li.task { list-style: none; margin-left: -1.3em; }
.doc li.task input { margin-right: 5px; transform: translateY(1px); cursor: pointer; accent-color: var(--green); }
.doc li.task.done > span { color: var(--muted); text-decoration: line-through; }
.doc a { color: var(--green); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--green) 40%, transparent); text-underline-offset: 3px; cursor: pointer; }
.doc code { background: var(--code); border-radius: 4px; padding: .1em .35em; font: .88em "D2Coding", "Consolas", monospace; color: var(--code-ink); }
.doc pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow: auto; margin: 8px 0; position: relative; }
.doc pre code { background: none; color: var(--ink); padding: 0; font-size: 13.5px; }
.doc pre[data-lang]::before { content: attr(data-lang); position: absolute; top: 5px; right: 10px; font-size: 11px; color: var(--muted); }
.doc blockquote { margin: 8px 0; padding: 2px 16px; border-left: 3px solid var(--wood-d); color: color-mix(in srgb, var(--ink) 85%, var(--muted)); }
.doc hr { border: 0; height: 1px; background: var(--line); margin: 20px 0; }
.doc table { border-collapse: collapse; margin: 10px 0; font-size: 14px; }
.doc th, .doc td { border: 1px solid var(--line); padding: 7px 11px; text-align: left; vertical-align: top; }
.doc th { background: var(--cream); font-weight: 700; color: var(--green-d); }
.doc .a-right { text-align: right; } .doc .a-center { text-align: center; }
.doc img { max-width: 100%; border-radius: 6px; }
.doc .blocked { color: var(--muted); font-size: 13px; }
.callout { border-radius: 8px; padding: 10px 16px; margin: 8px 0; background: var(--note); border-left: 4px solid color-mix(in srgb, var(--note) 40%, #3b82a6); }
.callout-title { font-weight: 700; font-size: 13.5px; margin-bottom: 2px; }
.c-tip { background: var(--tip); border-left-color: var(--leaf); } .c-important { background: var(--important); border-left-color: #8b6bb5; }
.c-warning { background: var(--warning); border-left-color: #d29a1e; } .c-caution { background: var(--caution); border-left-color: #c0503b; }

.slash { position: absolute; z-index: 30; width: 260px; max-height: 330px; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; }
.slash-item { display: flex; flex-direction: column; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.slash-item.on, .slash-item:hover { background: var(--green-soft); }
.slash-name { font-size: 14px; font-weight: 600; }
.slash-hint { font-size: 12px; color: var(--muted); }

@media (max-width: 760px) {
  .desk { padding: 12px 8px 0; }
  .block-add, .sb-hint { display: none; }
  .welcome-actions { grid-template-columns: 1fr; }
}
@page { size: A4; margin: 0; }
@media print {
  html, body, .desk { background: #fff !important; height: auto; }
  .tabs, .menubar, .rail, .statusbar, .block-add, .pagebreak span, .editors, .raw-wrap, .preview { display: none !important; }
  .print-doc { position: static; width: auto; }
  .pagebreak { border: 0; }
  .app { display: block; } .body { display: block; } .desk { padding: 0; overflow: visible; }
  .pages { display: block; zoom: 1 !important; }
  .sheet { box-shadow: none; border: 0; margin: 0; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .block:hover { background: none; }
}

<style>
/* 편집기(ProseMirror) 모양. 쪽은 A4 210×297mm, 여백 좌우 20mm·위아래 30mm, 본문 11pt·160%(한글 내보내기와 같다). */

.nm-sheet.flow { min-height: 0; } .nm-sheet.flow .nm-pm { min-height: 60vh; } /* 쪽 나눔 끔: 내용 길이대로 이어지는 한 장 */
.nm-pm { outline: none; min-height: 237mm; font-size: 11pt; line-height: 1.6; word-break: keep-all; overflow-wrap: anywhere; color: var(--ink); }
.nm-pm > * + * { margin-top: 0; }
.nm-pm p { margin: 5px 0; min-height: 1.6em; }
.nm-pm h1 { font-size: 2.05em; line-height: 1.25; margin: .2em 0 .35em; letter-spacing: -.02em; }
.nm-pm h1:first-child { padding-bottom: .35em; border-bottom: 2px solid var(--green-soft); }
.nm-pm h2 { font-size: 1.45em; line-height: 1.3; margin: 1.1em 0 .25em; letter-spacing: -.01em; }
.nm-pm h2::before { content: ""; display: inline-block; width: 6px; height: .9em; margin-right: 9px; border-radius: 2px; background: var(--leaf); vertical-align: -1px; }
.nm-pm h3 { font-size: 1.2em; margin: .9em 0 .2em; }
.nm-pm h4, .nm-pm h5, .nm-pm h6 { font-size: 1.03em; margin: .8em 0 .2em; color: var(--muted); }
.nm-pm ul, .nm-pm ol { margin: 5px 0; padding-left: 1.6em; }
.nm-pm li { margin: 2px 0; } .nm-pm li > p { margin: 0; }
.nm-pm li::marker { color: var(--leaf); }
.nm-pm ul[data-type="taskList"] { list-style: none; padding-left: .3em; }
.nm-pm ul[data-type="taskList"] li { display: flex; align-items: flex-start; gap: 7px; }
.nm-pm ul[data-type="taskList"] li > label { flex: none; margin-top: .35em; }
.nm-pm ul[data-type="taskList"] li > label input { accent-color: var(--green); cursor: pointer; margin: 0; }
.nm-pm ul[data-type="taskList"] li > div { flex: 1; min-width: 0; }
.nm-pm ul[data-type="taskList"] li[data-checked="true"] > div { color: var(--muted); text-decoration: line-through; }
.nm-pm a { color: var(--green); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--green) 40%, transparent); text-underline-offset: 3px; cursor: text; }
.nm-pm code { background: var(--code); border-radius: 4px; padding: .1em .35em; font: .88em "D2Coding", "Consolas", monospace; color: var(--code-ink); }
.nm-pm pre { background: var(--code); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; overflow: auto; margin: 8px 0; }
.nm-pm pre code { background: none; color: var(--ink); padding: 0; font-size: 13.5px; }
.nm-pm blockquote { margin: 8px 0; padding: 2px 16px; border-left: 3px solid var(--wood-d); color: color-mix(in srgb, var(--ink) 85%, var(--muted)); }
.nm-pm hr { border: 0; height: 1px; background: var(--line); margin: 20px 0; }
.nm-pm hr.ProseMirror-selectednode { outline: 2px solid var(--leaf); }
.nm-pm p.is-empty:first-child::before { content: attr(data-placeholder); color: var(--muted); float: left; height: 0; pointer-events: none; }
.nm-pm .nm-pagebreak.ProseMirror-selectednode, .nm-pm .ProseMirror-selectednode > div > img { outline: 2px solid var(--leaf); outline-offset: 2px; border-radius: 4px; }

/* 콜아웃 */
.nm-callout { display: flex; gap: 12px; border-radius: 8px; padding: 10px 14px; margin: 8px 0; background: var(--note); border-left: 4px solid #3b82a6; }
.nm-callout-label { flex: none; align-self: flex-start; border: 0; background: color-mix(in srgb, var(--paper) 60%, transparent); border-radius: 6px; padding: 2px 8px; font-size: 12.5px; font-weight: 700; color: var(--ink); cursor: pointer; margin-top: 4px; }
.nm-callout-body { flex: 1; min-width: 0; }
.nm-callout-body > p:first-child { margin-top: 0; } .nm-callout-body > p:last-child { margin-bottom: 0; }
.nm-callout.c-tip { background: var(--tip); border-left-color: var(--leaf); } .nm-callout.c-important { background: var(--important); border-left-color: #8b6bb5; }
.nm-callout.c-warning { background: var(--warning); border-left-color: #d29a1e; } .nm-callout.c-caution { background: var(--caution); border-left-color: #c0503b; }

/* 쪽 나눔 표시와 쪽 경계 */
.nm-pagebreak { margin: 10px 0; border-top: 1px dashed var(--wood-d); text-align: center; height: 0; }
.nm-pagebreak span { position: relative; top: -.8em; background: var(--paper); color: var(--muted); font-size: 8.5pt; padding: 0 8px; }
.nm-pagegap { margin: 0 -20mm; pointer-events: none; user-select: none; }
.nm-pagegap-fill { position: relative; background: var(--paper); }
.nm-pagegap-no { position: absolute; left: 0; right: 0; bottom: 12mm; text-align: center; font-size: 9pt; color: var(--muted); }
.nm-pagegap-desk { background: var(--desk); box-shadow: inset 0 8px 8px -8px rgba(60,50,20,.18), inset 0 -8px 8px -8px rgba(60,50,20,.18); margin: 0 -1px; }
.nm-pagegap-top { background: var(--paper); }
.nm-sheet-no { position: absolute; left: 0; right: 0; bottom: 12mm; text-align: center; font-size: 9pt; color: var(--muted); pointer-events: none; }

/* 표: 열 경계를 끌어 너비 조절(tiptap). 머리 줄은 연한 바탕. */
.nm-pm .tableWrapper { overflow: visible; margin: 10px 0; } /* 스크롤 막대가 열 경계 끌기와 겹치지 않게 - 너비는 모서리 손잡이로 쪽 안에 맞춘다 */
.nm-pm table { border-collapse: collapse; table-layout: fixed; width: 100%; max-width: 100%; font-size: 14px; }
.nm-pm th, .nm-pm td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; position: relative; min-width: 1em; }
.nm-pm th > p, .nm-pm td > p { margin: 0; min-height: 1.4em; }
.nm-pm th { background: var(--cream); font-weight: 700; color: var(--green-d); }
.nm-pm .selectedCell::after { content: ""; position: absolute; inset: 0; background: color-mix(in srgb, var(--leaf) 18%, transparent); pointer-events: none; }
.nm-pm .column-resize-handle { position: absolute; right: -2px; top: 0; bottom: -2px; width: 4px; background: var(--leaf); pointer-events: none; }
.nm-pm.resize-cursor { cursor: col-resize; }

/* 표 전체 테두리와 네 모서리 손잡이(커서가 표 안에 있을 때). 손잡이만 마우스를 받는다 */
.nm-tablebox { position: absolute; z-index: 3; border: 1.5px solid var(--leaf); border-radius: 3px; pointer-events: none; box-sizing: border-box; }
.nm-tablebox-h { position: absolute; width: 12px; height: 12px; background: var(--paper); border: 2px solid var(--leaf); border-radius: 50%; pointer-events: auto; }
.nm-tablebox-h[data-dir="top-left"] { left: -7px; top: -7px; cursor: nwse-resize; }
.nm-tablebox-h[data-dir="bottom-right"] { right: -7px; bottom: -7px; cursor: nwse-resize; }
.nm-tablebox-h[data-dir="top-right"] { right: -7px; top: -7px; cursor: nesw-resize; }
.nm-tablebox-h[data-dir="bottom-left"] { left: -7px; bottom: -7px; cursor: nesw-resize; }
body.nm-resizing { cursor: nwse-resize; user-select: none; }

/* 그림: 크기 조절 손잡이(tiptap), 정렬 */
.nm-pm img { max-width: 100%; height: auto; border-radius: 6px; display: block; }
.nm-pm img[data-align="center"] { margin-left: auto; margin-right: auto; }
.nm-pm img[data-align="right"] { margin-left: auto; }
.nm-pm div:has(> div > img[data-align="center"]) { justify-content: center; }
.nm-pm div:has(> div > img[data-align="right"]) { justify-content: flex-end; }
.nm-pm img[data-align="center"], .nm-pm img[data-align="right"] { margin: 0; }
/* 크기 조절 손잡이: 그림을 고르면 네 모서리에 초록 점 */
.nm-pm [data-resize-handle] { width: 12px; height: 12px; background: var(--paper); border: 2px solid var(--leaf); border-radius: 50%; z-index: 2; opacity: 0; transition: opacity .12s; }
.nm-pm .ProseMirror-selectednode [data-resize-handle], .nm-pm div:hover > div > [data-resize-handle] { opacity: 1; }
.nm-pm [data-resize-handle="top-left"] { cursor: nwse-resize; transform: translate(-50%, -50%); }
.nm-pm [data-resize-handle="bottom-right"] { cursor: nwse-resize; transform: translate(50%, 50%); }
.nm-pm [data-resize-handle="top-right"] { cursor: nesw-resize; transform: translate(50%, -50%); }
.nm-pm [data-resize-handle="bottom-left"] { cursor: nesw-resize; transform: translate(-50%, 50%); }

/* 끌기 손잡이(블록 왼쪽) */
.nm-handle { width: 18px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 5px; color: var(--wood-d); font-size: 13px; letter-spacing: -2px; cursor: grab; user-select: none; }
.nm-handle:hover { background: var(--green-soft); color: var(--green); }
.nm-handle:active { cursor: grabbing; }

/* / 메뉴 */
.nm-slash { position: fixed; z-index: 40; width: 260px; max-height: 330px; overflow: auto; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 5px; }
.nm-slash-item { display: flex; flex-direction: column; padding: 6px 10px; border-radius: 7px; cursor: pointer; }
.nm-slash-item.on, .nm-slash-item:hover { background: var(--green-soft); }
.nm-slash-name { font-size: 14px; font-weight: 600; } .nm-slash-hint { font-size: 12px; color: var(--muted); }

/* 글을 고르면 뜨는 서식 띠 */
.nm-bubble { position: absolute; z-index: 35; display: flex; align-items: center; gap: 1px; padding: 3px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); white-space: nowrap; }
.nm-bb { border: 1px solid transparent; background: none; border-radius: 6px; min-width: 28px; height: 28px; padding: 0 7px; font-size: 13px; color: var(--ink); cursor: pointer; }
.nm-bb:hover { background: var(--hover); } .nm-bb.on { background: var(--green-soft); border-color: var(--leaf); color: var(--green-d); }
.nm-bb-sep { width: 1px; height: 18px; background: var(--line); margin: 0 3px; }
.nm-bb-color { font-weight: 700; text-decoration: underline; text-decoration-color: #c00000; text-decoration-thickness: 3px; text-underline-offset: 3px; }
.nm-bb-hl { background: #ffff00; color: #000; }
.nm-pal { position: absolute; top: calc(100% + 4px); z-index: 36; display: grid; grid-template-columns: repeat(6, 22px); gap: 4px; padding: 8px; background: var(--paper); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow); }
.nm-pal button { width: 22px; height: 22px; padding: 0; border: 1px solid rgba(0,0,0,.15); border-radius: 5px; cursor: pointer; }
.nm-pal button.none { grid-column: 1 / -1; width: auto; height: auto; padding: 3px 6px; font-size: 12px; color: var(--muted); border-color: var(--line); background: none; }
.nm-pal.nm-list { display: flex; flex-direction: column; gap: 0; min-width: 150px; max-height: 320px; overflow: auto; padding: 5px; }
.nm-pal.nm-list .pi { width: 100%; height: auto; border: 0; background: none; padding: 6px 10px; border-radius: 6px; text-align: left; font-size: 13.5px; }
.nm-pal.nm-list .pi:hover { background: var(--green-soft); }

/* 끌어다 놓을 자리 표시 */
.ProseMirror-dropcursor { background: var(--leaf) !important; }
.ProseMirror-gapcursor:after { border-top-color: var(--ink); }

<script>
const MD = (() => {
// 농막 마크다운 → HTML. 외부 라이브러리 없이 직접 쓴다(검토할 수 있는 크기로).
// 안전 원칙: 원문 글자는 전부 esc()를 거친 뒤에만 HTML에 들어간다. 태그는 이 파일이 만든 것뿐이다.
// 원문의 HTML 태그는 그대로 글자로 보인다(<script>도 "&lt;script&gt;"로). 링크는 http·https·mailto·상대 경로만.

"use strict";

const esc = (s) =>
  String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");

/** 링크 주소 검사: 허용하지 않는 스킴(javascript:, data:, vbscript:, file: …)이면 null. */
function safeUrl(url) {
  const u = String(url).trim();
  // 제어 문자·공백을 끼워 스킴을 숨기는 수법("java\tscript:")을 막으려고 먼저 지운 꼴로 검사한다
  // 브라우저는 \를 /로 읽는다 - "/\서버\공유"가 "//서버/공유"(외부·SMB)가 되지 않게 바꿔서 본다(독립 검토 지적)
  const probe = u.replace(/[\u0000- \u007f-\u009f]/g, "").replace(/\\/g, "/").toLowerCase();
  if (/^(https?:|mailto:)/.test(probe)) return u;
  if (/^[a-z][a-z0-9+.-]*:/.test(probe)) return null;
  if (probe.startsWith("/")) return null; // 프로토콜 상대 주소(외부)·절대 경로
  return u;
}

/** 그림 주소 검사: 상대 경로(작업 폴더 안의 그림)와 래스터 data URI만. SVG는 스크립트를 품을 수 있어 뺀다. */
