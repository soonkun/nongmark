// 한글(hwpx) 내보내기 - 마크다운을 한글 문서로. 표는 한글의 진짜 표(hp:tbl)로, 그림은 문서 안에 넣는다(BinData).
// 바탕은 assets/hwpx-template(python-hwpx의 빈 문서 골격, Apache-2.0)이고, 글자·문단 모양과 본문(section0.xml)을 여기서 만든다.
// 쪽: A4(210×297mm), 여백 좌우 20mm·위아래 30mm. 마크다운의 <!-- pagebreak --> 는 쪽 나눔이 된다.
// 바깥과 통신하지 않는다 - 결과는 바이트 배열(Uint8Array)로 돌려주고 저장은 부르는 쪽이 한다.

"use strict";

const HWPX = (() => {
  const MM = 283.465; // 1mm = 283.465 HWPUNIT
  const PAGE = { width: 59528, height: 84186, left: Math.round(20 * MM), right: Math.round(20 * MM), top: Math.round(30 * MM), bottom: Math.round(30 * MM) };
  const TEXT_WIDTH = PAGE.width - PAGE.left - PAGE.right;
  const GREEN = "#1F7A42";
  const FONT_BODY = 2; // 맑은 고딕(머리에 덧붙인다)
  const FONT_CODE = 3; // 굴림체

  const xml = (s) => String(s).replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  let seq = 1000;
  const nid = () => String(++seq);

  /* ---- 글자 모양·문단 모양·테두리: 필요한 것만 만들어 머리(header.xml)에 덧붙인다 ---- */
  function Styles(header) {
    const count = (tag) => Number(header.match(new RegExp(`<hh:${tag} itemCnt="(\\d+)"`))[1]);
    const char = new Map();
    const para = new Map();
    const border = new Map();
    let nextChar = count("charProperties");
    let nextPara = count("paraProperties");
    let nextBorder = count("borderFills") + 1; // borderFill id는 1부터
    const out = { char: [], para: [], border: [] };

    // 글꼴: 기본 둘(맑은 고딕·굴림체) 외에 문서가 쓴 글꼴 이름은 쓰일 때 번호를 받는다(머리에 fontface로 덧붙임)
    const fonts = new Map([["맑은 고딕", FONT_BODY], ["굴림체", FONT_CODE]]);
    let nextFont = FONT_CODE + 1;
    function font(name) {
      if (!fonts.has(name)) fonts.set(name, nextFont++);
      return fonts.get(name);
    }

    function charPr({ size = 1100, b = false, i = false, s = false, u = false, color = "#000000", bg = "none", font = FONT_BODY } = {}) {
      const key = [size, b, i, s, u, color, bg, font].join("|");
      if (!char.has(key)) {
        const id = nextChar++;
        char.set(key, id);
        const f = `hangul="${font}" latin="${font}" hanja="${font}" japanese="${font}" other="${font}" symbol="${font}" user="${font}"`;
        const all = (v) => `hangul="${v}" latin="${v}" hanja="${v}" japanese="${v}" other="${v}" symbol="${v}" user="${v}"`;
        out.char.push(
          `<hh:charPr id="${id}" height="${size}" textColor="${color}" shadeColor="${bg}" useFontSpace="0" useKerning="0" symMark="NONE" borderFillIDRef="2">` +
            `<hh:fontRef ${f}/><hh:ratio ${all(100)}/><hh:spacing ${all(0)}/><hh:relSz ${all(100)}/><hh:offset ${all(0)}/>` +
            (i ? "<hh:italic/>" : "") + (b ? "<hh:bold/>" : "") +
            `<hh:underline type="${u ? "BOTTOM" : "NONE"}" shape="SOLID" color="${color}"/>` +
            `<hh:strikeout shape="${s ? "SOLID" : "NONE"}" color="#000000"/><hh:outline type="NONE"/>` +
            `<hh:shadow type="NONE" color="#C0C0C0" offsetX="10" offsetY="10"/></hh:charPr>`,
        );
      }
      return char.get(key);
    }

    function borderFill({ left = "NONE", right = "NONE", top = "NONE", bottom = "NONE", width = "0.12 mm", color = "#000000", fill = null } = {}) {
      const key = [left, right, top, bottom, width, color, fill].join("|");
      if (!border.has(key)) {
        const id = nextBorder++;
        border.set(key, id);
        const side = (tag, type) => `<hh:${tag} type="${type}" width="${width}" color="${color}"/>`;
        out.border.push(
          `<hh:borderFill id="${id}" threeD="0" shadow="0" centerLine="NONE" breakCellSeparateLine="0">` +
            `<hh:slash type="NONE" Crooked="0" isCounter="0"/><hh:backSlash type="NONE" Crooked="0" isCounter="0"/>` +
            side("leftBorder", left) + side("rightBorder", right) + side("topBorder", top) + side("bottomBorder", bottom) +
            `<hh:diagonal type="SOLID" width="0.1 mm" color="#000000"/>` +
            (fill ? `<hc:fillBrush><hc:winBrush faceColor="${fill}" hatchColor="#000000" alpha="0"/></hc:fillBrush>` : "") +
            `</hh:borderFill>`,
        );
      }
      return border.get(key);
    }

    function paraPr({ align = "JUSTIFY", left = 0, indent = 0, prev = 0, next = 300, line = 160, keepNext = false, borderId = 2, borderOffset = 0 } = {}) {
      const key = [align, left, indent, prev, next, line, keepNext, borderId, borderOffset].join("|");
      if (!para.has(key)) {
        const id = nextPara++;
        para.set(key, id);
        const margin = `<hh:margin><hc:intent value="${indent}" unit="HWPUNIT"/><hc:left value="${left}" unit="HWPUNIT"/><hc:right value="0" unit="HWPUNIT"/><hc:prev value="${prev}" unit="HWPUNIT"/><hc:next value="${next}" unit="HWPUNIT"/></hh:margin><hh:lineSpacing type="PERCENT" value="${line}" unit="HWPUNIT"/>`;
        out.para.push(
          `<hh:paraPr id="${id}" tabPrIDRef="0" condense="0" fontLineHeight="0" snapToGrid="1" suppressLineNumbers="0" checked="0" textDir="LTR">` +
            `<hh:align horizontal="${align}" vertical="BASELINE"/><hh:heading type="NONE" idRef="0" level="0"/>` +
            `<hh:breakSetting breakLatinWord="KEEP_WORD" breakNonLatinWord="KEEP_WORD" widowOrphan="1" keepWithNext="${keepNext ? 1 : 0}" keepLines="0" pageBreakBefore="0" lineWrap="BREAK"/>` +
            `<hh:autoSpacing eAsianEng="0" eAsianNum="0"/>` +
            `<hp:switch><hp:case hp:required-namespace="http://www.hancom.co.kr/hwpml/2016/HwpUnitChar">${margin}</hp:case><hp:default>${margin}</hp:default></hp:switch>` +
            `<hh:border borderFillIDRef="${borderId}" offsetLeft="${borderOffset}" offsetRight="0" offsetTop="0" offsetBottom="0" connect="0" ignoreMargin="0"/></hh:paraPr>`,
        );
      }
      return para.get(key);
    }

    function apply(h) {
      // 쓰인 글꼴(맑은 고딕, 굴림체 + 문서가 고른 것)을 모든 언어 묶음에 더한다
      const faces = [...fonts].map(([name, id]) =>
        `<hh:font id="${id}" face="${xml(name)}" type="TTF" isEmbedded="0"><hh:typeInfo familyType="FCAT_GOTHIC" weight="6" proportion="${id === FONT_CODE ? 9 : 4}" contrast="0" strokeVariation="1" armStyle="1" letterform="1" midline="1" xHeight="1"/></hh:font>`).join("");
      h = h.replace(/<hh:fontface lang="([A-Z]+)" fontCnt="(\d+)">([\s\S]*?)<\/hh:fontface>/g, (_, lang, n, body) =>
        `<hh:fontface lang="${lang}" fontCnt="${Number(n) + fonts.size}">${body}${faces}</hh:fontface>`);
      const add = (tag, items) => {
        h = h.replace(new RegExp(`<hh:${tag} itemCnt="(\\d+)">`), (_, n) => `<hh:${tag} itemCnt="${Number(n) + items.length}">`);
        h = h.replace(`</hh:${tag}>`, items.join("") + `</hh:${tag}>`);
      };
      add("borderFills", out.border);
      add("charProperties", out.char);
      add("paraProperties", out.para);
      return h;
    }
    return { charPr, paraPr, borderFill, font, apply };
  }

  /* ---- 그림 크기 읽기(png·jpg·gif·webp 머리) ---- */
  function imageSize(b) {
    const u32 = (o) => (b[o] << 24) | (b[o + 1] << 16) | (b[o + 2] << 8) | b[o + 3];
    if (b[0] === 0x89 && b[1] === 0x50) return { w: u32(16), h: u32(20), ext: "png" };
    if (b[0] === 0x47 && b[1] === 0x49) return { w: b[6] | (b[7] << 8), h: b[8] | (b[9] << 8), ext: "gif" };
    if (b[0] === 0x52 && b[8] === 0x57) {
      const kind = String.fromCharCode(b[12], b[13], b[14], b[15]);
      if (kind === "VP8X") return { w: 1 + (b[24] | (b[25] << 8) | (b[26] << 16)), h: 1 + (b[27] | (b[28] << 8) | (b[29] << 16)), ext: "webp" };
      if (kind === "VP8L") { const v = b[21] | (b[22] << 8) | (b[23] << 16) | (b[24] << 24); return { w: (v & 0x3fff) + 1, h: ((v >> 14) & 0x3fff) + 1, ext: "webp" }; }
      return { w: (b[26] | (b[27] << 8)) & 0x3fff, h: (b[28] | (b[29] << 8)) & 0x3fff, ext: "webp" };
    }
    if (b[0] === 0xff && b[1] === 0xd8) {
      for (let o = 2; o + 9 < b.length; ) {
        if (b[o] !== 0xff) { o++; continue; }
        const marker = b[o + 1];
        const len = (b[o + 2] << 8) | b[o + 3];
        if (marker >= 0xc0 && marker <= 0xcf && marker !== 0xc4 && marker !== 0xc8 && marker !== 0xcc) return { h: (b[o + 5] << 8) | b[o + 6], w: (b[o + 7] << 8) | b[o + 8], ext: "jpg" };
        o += 2 + len;
      }
    }
    return null;
  }

  /* ---- 본문 만들기 ---- */
  async function build(markdown, opts = {}) {
    const tpl = opts.template; // {header, version, settings, container, containerRdf, manifest}
    const st = Styles(tpl.header);
    const images = []; // {id, ext, bytes}
    const body = [];
    let pendingBreak = false;

    const para = (inner, pr) => {
      const pb = pendingBreak ? "1" : "0";
      pendingBreak = false;
      return `<hp:p id="${nid()}" paraPrIDRef="${pr}" styleIDRef="0" pageBreak="${pb}" columnBreak="0" merged="0">${inner}</hp:p>`;
    };
    const run = (text, charId) => {
      const parts = String(text).split("\n");
      return `<hp:run charPrIDRef="${charId}"><hp:t>${parts.map(xml).join("<hp:lineBreak/>")}</hp:t></hp:run>`;
    };
    const runsFor = (src, base = {}) =>
      MDX.inlineRuns(src).map((r) => {
        if (r.image) return "";
        const look = { ...base };
        if (r.b) look.b = true;
        if (r.i) look.i = true;
        if (r.s) look.s = true;
        if (r.code) look.font = FONT_CODE;
        if (r.code) look.color = "#B4472D";
        if (r.link) { look.u = true; look.color = GREEN; }
        if (r.u) look.u = true;
        if (r.color) look.color = r.color.toUpperCase();
        if (r.bg) look.bg = r.bg.toUpperCase();
        if (r.font) look.font = st.font(r.font);
        if (r.size) look.size = Math.round(parseFloat(r.size) * 100);
        return run(r.text, st.charPr(look));
      }).join("") || run("", st.charPr(base));
    const imagesIn = (src) => MDX.inlineRuns(src).filter((r) => r.image).map((r) => r.image);

    async function picture(src) {
      if (!opts.readImage) return null;
      let bytes;
      try { bytes = await opts.readImage(src); } catch { return null; }
      const size = bytes && imageSize(bytes);
      if (!size || !size.w || !size.h) return null;
      const id = `BIN${String(images.length + 1).padStart(4, "0")}`;
      images.push({ id, ext: size.ext, bytes });
      // 96dpi 기준 크기, 본문 폭·쪽 높이의 절반을 넘지 않게
      let w = Math.round(size.w * 7200 / 96);
      let h = Math.round(size.h * 7200 / 96);
      const scale = Math.min(1, TEXT_WIDTH / w, (PAGE.height - PAGE.top - PAGE.bottom) * 0.6 / h);
      w = Math.round(w * scale); h = Math.round(h * scale);
      const pid = nid();
      return `<hp:run charPrIDRef="${st.charPr()}"><hp:pic textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" reverse="0" id="${pid}" zOrder="0" numberingType="PICTURE" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${pid}">` +
        `<hp:offset x="0" y="0"/><hp:orgSz width="${w}" height="${h}"/><hp:curSz width="${w}" height="${h}"/><hp:flip horizontal="0" vertical="0"/>` +
        `<hp:rotationInfo angle="0" centerX="${w >> 1}" centerY="${h >> 1}" rotateimage="1"/><hp:renderingInfo><hc:transMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:scaMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:rotMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/></hp:renderingInfo>` +
        `<hp:imgRect><hc:pt0 x="0" y="0"/><hc:pt1 x="${w}" y="0"/><hc:pt2 x="${w}" y="${h}"/><hc:pt3 x="0" y="${h}"/></hp:imgRect><hp:imgClip left="0" right="${w}" top="0" bottom="${h}"/>` +
        `<hp:inMargin left="0" right="0" top="0" bottom="0"/><hp:imgDim dimwidth="${w}" dimheight="${h}"/><hc:img binaryItemIDRef="${id}" bright="0" contrast="0" effect="REAL_PIC" alpha="0"/><hp:effects/>` +
        `<hp:sz width="${w}" height="${h}" widthRelTo="ABSOLUTE" heightRelTo="ABSOLUTE" protect="0"/><hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>` +
        `<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:shapeComment/></hp:pic></hp:run>`;
    }

    // 표(진짜 한글 표): 열 너비는 글자 수 비례(최소 8%), 머리 줄은 굵게·연초록 바탕, 표 머리 줄 반복
    function table(rows, align, opt = {}) {
      const cols = Math.max(...rows.map((r) => r.length));
      const len = Array.from({ length: cols }, (_, c) => Math.max(2, ...rows.map((r) => [...(r[c] || "")].length)));
      const total = len.reduce((a, b) => a + b, 0);
      let widths = len.map((n) => Math.max(0.08, n / total));
      const sum = widths.reduce((a, b) => a + b, 0);
      widths = widths.map((w) => Math.round((w / sum) * TEXT_WIDTH));
      widths[cols - 1] += TEXT_WIDTH - widths.reduce((a, b) => a + b, 0);
      const line = st.borderFill({ left: "SOLID", right: "SOLID", top: "SOLID", bottom: "SOLID", color: "#7F7F7F" });
      const headFill = st.borderFill({ left: "SOLID", right: "SOLID", top: "SOLID", bottom: "SOLID", color: "#7F7F7F", fill: opt.headFill || "#E8F1E9" });
      const cellH = 1700;
      let trs = "";
      rows.forEach((row, r) => {
        let tds = "";
        for (let c = 0; c < cols; c++) {
          const head = r === 0 && !opt.noHead;
          const a = align[c] === "right" ? "RIGHT" : align[c] === "center" || head ? "CENTER" : "LEFT";
          const pr = st.paraPr({ align: a, next: 0, line: 150 });
          const cellText = (row[c] ?? "").split(/<br\s*\/?>/i).join("\n");
          const content = opt.raw ? cellText.split("\n").map((l) => para(run(l, st.charPr({ size: 950, font: FONT_CODE })), pr)).join("") : para(runsFor(cellText, { size: 1000, b: head }), pr);
          tds += `<hp:tc name="" header="${head ? 1 : 0}" hasMargin="0" protect="0" editable="0" dirty="1" borderFillIDRef="${opt.fill ? opt.fill : head ? headFill : line}">` +
            `<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="CENTER" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${content}</hp:subList>` +
            `<hp:cellAddr colAddr="${c}" rowAddr="${r}"/><hp:cellSpan colSpan="1" rowSpan="1"/><hp:cellSz width="${widths[c]}" height="${cellH}"/><hp:cellMargin left="510" right="510" top="283" bottom="283"/></hp:tc>`;
        }
        trs += `<hp:tr>${tds}</hp:tr>`;
      });
      const tid = nid();
      const tbl = `<hp:tbl id="${tid}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="CELL" repeatHeader="${opt.noHead ? 0 : 1}" rowCnt="${rows.length}" colCnt="${cols}" cellSpacing="0" borderFillIDRef="${line}" noAdjust="0">` +
        `<hp:sz width="${TEXT_WIDTH}" widthRelTo="ABSOLUTE" height="${cellH * rows.length}" heightRelTo="ABSOLUTE" protect="0"/>` +
        `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="COLUMN" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>` +
        `<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="510" right="510" top="283" bottom="283"/>${trs}</hp:tbl>`;
      return para(`<hp:run charPrIDRef="${st.charPr()}">${tbl}</hp:run><hp:run charPrIDRef="${st.charPr()}"><hp:t/></hp:run>`, st.paraPr({ next: 400 }));
    }

    const cellsOf = (row) => row.trim().replace(/^\|/, "").replace(/\|$/, "").split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, "|"));
    const HEAD = { 1: 1800, 2: 1500, 3: 1300, 4: 1150, 5: 1100, 6: 1100 };

    async function block(md, depth = 0) {
      const lines = md.split("\n");
      const first = lines[0];
      if (MDX.RE.pagebreak.test(first)) { pendingBreak = true; return; }
      const fence = first.match(MDX.RE.fence);
      if (fence) {
        const closed = lines.length > 1 && /^\s*(```+|~~~+)\s*$/.test(lines[lines.length - 1]);
        const code = lines.slice(1, closed ? -1 : undefined).join("\n");
        body.push(table([[code]], [], { noHead: true, raw: true, fill: st.borderFill({ left: "SOLID", right: "SOLID", top: "SOLID", bottom: "SOLID", color: "#D9D2BF", fill: "#F6F3EA" }) }));
        return;
      }
      const h = first.match(MDX.RE.heading);
      if (h && lines.length === 1) {
        const level = h[1].length;
        body.push(para(runsFor(MDX.headingText(h[2]), { size: HEAD[level], b: true, color: level === 1 ? "#000000" : "#1A1A1A" }), st.paraPr({ align: "LEFT", prev: level === 1 ? 0 : 900, next: level === 1 ? 600 : 300, keepNext: true, line: 150 })));
        return;
      }
      if (MDX.RE.hr.test(first) && lines.length === 1) {
        body.push(para(run("", st.charPr({ size: 600 })), st.paraPr({ next: 400, borderId: st.borderFill({ bottom: "SOLID", color: "#B5AD98" }) })));
        return;
      }
      if (MDX.RE.table.test(first) && lines.length >= 2 && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(lines[1])) {
        const align = cellsOf(lines[1]).map((c) => (c.startsWith(":") && c.endsWith(":") ? "center" : c.endsWith(":") ? "right" : ""));
        body.push(table([cellsOf(lines[0]), ...lines.slice(2).map(cellsOf)], align));
        return;
      }
      if (MDX.RE.list.test(first)) {
        const counters = [];
        for (const line of lines) {
          const m = line.match(MDX.RE.list);
          if (!m) { // 이어지는 줄
            body.push(para(runsFor(line.trim()), st.paraPr({ left: 1200 * (counters.length || 1), next: 100 })));
            continue;
          }
          const level = Math.min(6, Math.floor(m[1].replace(/\t/g, "    ").length / 2));
          counters.length = level + 1;
          let text = m[3];
          let mark;
          const task = text.match(/^\[([ xX])\]\s+([\s\S]*)$/);
          if (task) { mark = task[1] === " " ? "☐ " : "☑ "; text = task[2]; }
          else if (/\d/.test(m[2])) { counters[level] = counters[level] ? counters[level] + 1 : parseInt(m[2], 10); mark = `${counters[level]}. `; }
          else mark = ["• ", "◦ ", "▪ "][level % 3];
          const left = 1000 + level * 1200;
          body.push(para(run(mark, st.charPr({ color: GREEN })) + runsFor(text), st.paraPr({ left, indent: -800, next: 120 })));
        }
        body.push(para(run("", st.charPr({ size: 400 })), st.paraPr({ next: 0, line: 100 })));
        return;
      }
      if (MDX.RE.quote.test(first) && depth < 5) {
        const inner = lines.map((l) => l.replace(/^\s*>\s?/, ""));
        const c = inner[0].match(/^\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]\s*(.*)$/i);
        if (c) {
          const kind = c[1].toUpperCase();
          const fill = { NOTE: "#E8F2F6", TIP: "#E7F3E6", IMPORTANT: "#F1ECF7", WARNING: "#FBF2DC", CAUTION: "#FBE9E6" }[kind];
          const title = c[2] || { NOTE: "참고", TIP: "팁", IMPORTANT: "중요", WARNING: "주의", CAUTION: "경고" }[kind];
          const text = [`**${title}**`, ...inner.slice(1)].join("\n");
          body.push(table([[text.replace(/\n/g, "<br>")]], [], { noHead: true, fill: st.borderFill({ left: "SOLID", width: "0.7 mm", color: "#8FA89A", fill }) }));
          return;
        }
        const pr = st.paraPr({ left: 1400, next: 150, borderId: st.borderFill({ left: "SOLID", width: "0.5 mm", color: "#CDB98F" }), borderOffset: 600 });
        for (const b of MDX.splitBlocks(inner.join("\n"))) body.push(para(runsFor(b, { color: "#555555" }), pr));
        return;
      }
      // 문단(+그 안의 그림은 따로 한 줄씩)
      const text = lines.join("\n");
      const onlyImage = MDX.inlineRuns(text).every((r) => r.image || !r.text.trim());
      if (!onlyImage) body.push(para(runsFor(text), st.paraPr()));
      for (const img of imagesIn(text)) {
        const pic = await picture(img.src);
        body.push(para(pic || run(`[그림: ${img.alt || img.src}]`, st.charPr({ color: "#888888" })), st.paraPr({ align: "CENTER" })));
      }
    }

    for (const b of MDX.splitBlocks(markdown)) await block(b);

    // 첫 문단의 쪽 설정(secPr): 템플릿 문단을 그대로 쓰고 쪽 크기·여백만 바꾼다
    const sec0 = opts.template.section
      .replace(/<hp:pagePr [^>]*>/, `<hp:pagePr landscape="WIDELY" width="${PAGE.width}" height="${PAGE.height}" gutterType="LEFT_ONLY">`)
      .replace(/<hp:margin [^>]*\/>/, `<hp:margin header="0" footer="0" gutter="0" left="${PAGE.left}" right="${PAGE.right}" top="${PAGE.top}" bottom="${PAGE.bottom}"/>`)
      .replace(/<hp:linesegarray>[\s\S]*?<\/hp:linesegarray>/g, "");
    const section = sec0.replace("</hs:sec>", body.join("") + "</hs:sec>");

    let header = st.apply(opts.template.header);
    if (images.length) {
      const items = images.map((im, i) => `<hh:binItem id="${i}" Type="Embedding" BinData="${im.id}.${im.ext}" Format="${im.ext}"/>`).join("");
      header = header.replace("</hh:refList>", `<hh:binDataList itemCnt="${images.length}">${items}</hh:binDataList></hh:refList>`);
    }
    const now = new Date().toISOString().replace(/\.\d+Z$/, "Z");
    const title = xml(opts.title || "");
    const mime = { png: "image/png", jpg: "image/jpeg", gif: "image/gif", webp: "image/webp" };
    const hpf = `<?xml version="1.0" encoding="UTF-8" standalone="yes" ?><opf:package xmlns:opf="http://www.idpf.org/2007/opf/" xmlns:dc="http://purl.org/dc/elements/1.1/" version="" unique-identifier="" id="">` +
      `<opf:metadata><opf:title>${title}</opf:title><opf:language>ko</opf:language><opf:meta name="creator" content="text">새싹이의 농막</opf:meta>` +
      `<opf:meta name="CreatedDate" content="text">${now}</opf:meta><opf:meta name="ModifiedDate" content="text">${now}</opf:meta></opf:metadata>` +
      `<opf:manifest><opf:item id="header" href="Contents/header.xml" media-type="application/xml"/><opf:item id="section0" href="Contents/section0.xml" media-type="application/xml"/><opf:item id="settings" href="settings.xml" media-type="application/xml"/>` +
      images.map((im) => `<opf:item id="${im.id}" href="BinData/${im.id}.${im.ext}" media-type="${mime[im.ext]}" isEmbeded="1"/>`).join("") +
      `</opf:manifest><opf:spine><opf:itemref idref="header" linear="yes"/><opf:itemref idref="section0" linear="yes"/></opf:spine></opf:package>`;
    const enc = (s) => new TextEncoder().encode(s);
    const files = [
      ["mimetype", enc("application/hwp+zip")],
      ["version.xml", enc(opts.template.version)],
      ["Contents/header.xml", enc(header)],
      ["Contents/section0.xml", enc(section)],
      ["settings.xml", enc(opts.template.settings)],
      ["Contents/content.hpf", enc(hpf)],
      ["META-INF/container.xml", enc(opts.template.container)],
      ["META-INF/container.rdf", enc(opts.template.containerRdf)],
      ["META-INF/manifest.xml", enc(opts.template.manifest)],
      ["Preview/PrvText.txt", enc(markdown.slice(0, 1000))],
      ...images.map((im) => [`BinData/${im.id}.${im.ext}`, im.bytes]),
    ];
    return zip(files);
  }

  /* ---- ZIP(무압축) - mimetype이 첫 항목이어야 한글이 연다 ---- */
  const CRC = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
    return t;
  })();
  const crc32 = (b) => { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; };

  function zip(files) {
    const parts = [];
    const central = [];
    let offset = 0;
    const le = (n, size) => { const a = new Uint8Array(size); for (let i = 0; i < size; i++) a[i] = (n >>> (8 * i)) & 0xff; return a; };
    for (const [name, data] of files) {
      const nameBytes = new TextEncoder().encode(name);
      const crc = crc32(data);
      const local = [le(0x04034b50, 4), le(20, 2), le(0x0800, 2), le(0, 2), le(0, 2), le(0x21, 2), le(crc, 4), le(data.length, 4), le(data.length, 4), le(nameBytes.length, 2), le(0, 2), nameBytes];
      const localLen = local.reduce((a, p) => a + p.length, 0);
      parts.push(...local, data);
      central.push(le(0x02014b50, 4), le(20, 2), le(20, 2), le(0x0800, 2), le(0, 2), le(0, 2), le(0x21, 2), le(crc, 4), le(data.length, 4), le(data.length, 4), le(nameBytes.length, 2), le(0, 2), le(0, 2), le(0, 2), le(0, 2), le(0, 4), le(offset, 4), nameBytes);
      offset += localLen + data.length;
    }
    const cenLen = central.reduce((a, p) => a + p.length, 0);
    const end = [le(0x06054b50, 4), le(0, 2), le(0, 2), le(files.length, 2), le(files.length, 2), le(cenLen, 4), le(offset, 4), le(0, 2)];
    const all = [...parts, ...central, ...end];
    const out = new Uint8Array(all.reduce((a, p) => a + p.length, 0));
    let o = 0;
    for (const p of all) { out.set(p, o); o += p.length; }
    return out;
  }

  return { build, imageSize, PAGE };
})();

if (false && typeof module !== "undefined") module.exports = { HWPX, setMDX: (m) => (global.MDX = m) };

// 새싹이의 농막 화면. 메모장·한글처럼 문서를 탭으로 열고(폴더 보기 없음), 본문은 편집기(NMEditor, ProseMirror)가 맡는다.
// 파일은 언제나 마크다운(.md). 편집기 ⇄ 마크다운 변환은 편집기 묶음(web/editor-app)이 한다.
// 저장소는 둘 중 하나 - 같은 함수 모양(read/write/saveAsset/imageUrl)을 갖는다:
//   native : nongmak.exe 창(WebView2) 안. 프로그램이 넣어 준 nm_* 함수를 부른다(같은 프로세스, 네트워크 없음). 문서가 든 폴더(dir)가 열쇠.
//   single : 브라우저에서 nongmak.html을 연 경우 - 파일 하나를 열고 내려받기로 저장.
// 네트워크: 이 코드는 어디에도 연결하지 않는다. 페이지의 CSP가 connect-src 'none'으로 막는다.

"use strict";

const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, text) => {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
};
const MD_EXT = /\.(md|markdown)$/i;

/* ---------------- 저장소 ---------------- */

const NATIVE = !!window.NONGMAK_NATIVE;

function blobToBase64(blob) {
  return new Promise((ok, fail) => {
    const r = new FileReader();
    r.onload = () => ok(String(r.result).split(",")[1] || "");
    r.onerror = () => fail(r.error);
    r.readAsDataURL(blob);
  });
}

function nativeStore(info) {
  const dir = info.dir; // 프로그램이 등록한 폴더만 받는다
  return {
    kind: "native",
    rootName: info.root,
    dir,
    read: (p) => window.nm_read(dir, p),
    write: (p, text) => window.nm_write(dir, p, text),
    async saveAsset(name, blob) { return window.nm_saveAsset(dir, name, await blobToBase64(blob)); },
    imageUrl: (p) => window.nm_image(dir, p), // data: 주소
  };
}

function singleStore(name, text) {
  const files = { [name]: text };
  return {
    kind: "single",
    rootName: "",
    dir: "",
    async read(p) { return files[p]; },
    async write(p, t) {
      files[p] = t;
      const a = el("a");
      a.href = URL.createObjectURL(new Blob([t], { type: "text/markdown;charset=utf-8" }));
      a.download = p.split("/").pop();
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    },
    async saveAsset() { throw new Error("그림 넣기는 프로그램 창(nongmak.exe)에서 쓸 수 있습니다."); },
    async imageUrl() { throw new Error("no folder"); },
  };
}

/* ---------------- 상태 ---------------- */

// 탭 하나 = 문서 하나 = 편집기 하나. state.tab이 지금 보는 탭.
const state = {
  tabs: [], // {store, path, untitled, dirty, ed(편집기), host(div), saveTimer}
  tab: -1,
  zoom: 1,
  raw: false,
  pages: true, // 쪽 나눔 보기(끄면 내용 길이대로 이어지는 한 장)
};
const cur = () => state.tabs[state.tab];

const status = (text, kind = "") => {
  const s = $("#status");
  s.textContent = text;
  s.className = "status " + kind;
};

/* ---------------- 탭(열린 문서) ---------------- */

function nameOf(t) {
  if (t.path) return t.path.split("/").pop().replace(MD_EXT, "");
  return (MD.titleOf(t.ed ? t.ed.getMarkdown() : "") || "새 문서").replace(/[\\/:*?"<>|]/g, " ").trim().slice(0, 60) || "새 문서";
}

/** 문서 기준 상대 경로 → 폴더 기준 경로. 폴더 밖(..로 루트를 넘음)이면 null. */
function resolvePath(rel, t = cur()) {
  let p;
  try {
    p = decodeURI(String(rel).split("#")[0].split("?")[0]).replace(/\\/g, "/");
  } catch {
    return null;
  }
  const base = (t?.path || "").split("/").slice(0, -1);
  const parts = p.startsWith("/") ? [] : base;
  for (const seg of p.split("/")) {
    if (!seg || seg === ".") continue;
    if (seg === "..") {
      if (!parts.length) return null;
      parts.pop();
    } else parts.push(seg);
  }
  return parts.join("/");
}

/** 탭을 만들고 편집기를 붙인다. */
async function addTab(doc, markdown) {
  const t = { untitled: false, dirty: false, ...doc };
  t.host = el("div", "nm-desk");
  t.host.hidden = true;
  $("#editors").append(t.host);
  t.ed = window.NMEditor.create(t.host, {
    markdown,
    pages: state.pages,
    resolveImage: async (src) => {
      const img = MD.safeImage(src);
      if (!img) return "";
      if (img.kind === "data") return img.src;
      const rel = resolvePath(img.src, t);
      if (!rel) return "";
      try { return await t.store.imageUrl(rel); } catch { return ""; }
    },
    saveImage: (file) => storeImage(file, t),
  });
  t.ed.on("change", () => { if (t === cur()) changed(); });
  t.ed.on("pages", (n) => { if (t === cur()) $("#pages").textContent = n ? `${n}쪽` : ""; });
  t.ed.on("state", () => { if (t === cur()) fmtState(); });
  t.host.addEventListener("click", (ev) => {
    const a = ev.target.closest("a[href]");
    if (a && ev.ctrlKey) { ev.preventDefault(); followLink(a.getAttribute("href")); } // 편집 중엔 Ctrl+클릭이 링크 열기
  });
  await t.ed.ready;
  state.tabs.push(t);
  showHome(false);
  await activate(state.tabs.length - 1);
  return t;
}

/** 탭 j를 보여 준다. 지금 문서는 저장해 두고(제목 없는 새 문서는 탭에 남는다) 바꾼다. */
async function activate(j) {
  const prev = cur();
  if (prev && prev !== state.tabs[j]) prev.host.hidden = true;
  state.tab = j;
  const t = cur();
  t.host.hidden = false;
  if (state.raw) $("#raw").value = t.ed.getMarkdown();
  if (state.zoom <= PREVIEW_ZOOM) await setZoom(state.zoom);
  renderTabs();
  setDocTitle();
  countChars();
  fmtState();
  status(t.dirty ? "저장 안 됨 · Ctrl+S" : t.untitled ? "새 문서" : "열림");
}

async function closeTab(j) {
  const t = state.tabs[j];
  if (!t) return;
  if (t.dirty) {
    if (j !== state.tab) await activate(j); // 어느 문서인지 보이게 한 뒤 묻는다
    if (!(await askSave(t))) return;
  }
  t.ed.destroy();
  t.host.remove();
  state.tabs.splice(j, 1);
  if (!state.tabs.length) {
    state.tab = -1;
    renderTabs();
    return showHome(true); // 다 닫으면 대문으로
  }
  const next = j < state.tab ? state.tab - 1 : Math.min(state.tab, state.tabs.length - 1);
  state.tab = -1;
  await activate(next);
}

function renderTabs() {
  const bar = $("#tabs");
  bar.querySelectorAll(".tab").forEach((x) => x.remove());
  const add = $("#tab-add");
  state.tabs.forEach((t, j) => {
    const name = nameOf(t);
    const tab = el("div", "tab" + (j === state.tab ? " on" : ""));
    tab.title = t.store?.dir && t.path ? t.store.dir + "\\" + t.path.replace(/\//g, "\\") : name;
    tab.append(el("span", "tab-name", name), el("span", "tab-dot" + (t.dirty || t.untitled ? " show" : ""), "●"));
    const x = el("button", "tab-x", "×");
    x.title = "닫기 (Ctrl+W)";
    x.onclick = (ev) => { ev.stopPropagation(); closeTab(j); };
    tab.append(x);
    tab.onclick = () => { if (j !== state.tab) activate(j); };
    tab.onauxclick = (ev) => { if (ev.button === 1) closeTab(j); };
    bar.insertBefore(tab, add);
  });
}

/** 폴더(store) 안의 문서를 탭으로 연다. 이미 열려 있으면 그 탭으로. */
async function openPath(store, path) {
  const j = state.tabs.findIndex((t) => t.store?.dir === store.dir && t.path === path);
  if (j >= 0) return activate(j);
  try {
    const text = await store.read(path);
    await addTab({ store, path }, text);
    rememberRecent(store, path);
  } catch (e) {
    status("열지 못했습니다: " + (e.message || e), "error");
  }
}

/* ---------------- 대문과 최근 문서 ---------------- */

function showHome(on) {
  $("#app").classList.toggle("home", on);
  $("#welcome").hidden = !on;
  if (on) {
    document.title = "새싹이의 농막";
    if (NATIVE) window.nm_setTitle("");
    renderRecent();
  }
}

function recentList() {
  try { return JSON.parse(localStorage.getItem("nongmak.recent") || "[]"); } catch { return []; }
}

function rememberRecent(store, path) {
  if (store.kind !== "native" || !path) return;
  const full = store.dir + "\\" + path.replace(/\//g, "\\");
  const list = [{ full, name: path.split("/").pop().replace(MD_EXT, "") }, ...recentList().filter((r) => r.full !== full)].slice(0, 8);
  try { localStorage.setItem("nongmak.recent", JSON.stringify(list)); } catch { /* 기억 못 해도 된다 */ }
}

function renderRecent() {
  const list = recentList();
  $("#w-recent").hidden = !NATIVE || !list.length;
  const box = $("#w-recent-list");
  box.textContent = "";
  for (const r of list) {
    const b = el("button");
    b.append(el("span", "r-name", r.name), el("span", "r-path", r.full));
    b.title = r.full;
    b.onclick = async () => {
      try {
        const info = await window.nm_openRecent(r.full);
        if (info && info.root) await openPath(nativeStore(info), info.open);
      } catch (e) {
        status("열지 못했습니다(옮겨졌거나 지워진 문서): " + e, "error");
        try { localStorage.setItem("nongmak.recent", JSON.stringify(list.filter((x) => x.full !== r.full))); } catch { /* 무시 */ }
        renderRecent();
      }
    };
    box.append(b);
  }
}

/* ---------------- 문서 글·저장 ---------------- */

const docText = (t = cur()) => (t ? (state.raw && t === cur() ? $("#raw").value : t.ed.getMarkdown()) : "");

function setDocTitle() {
  const t = cur();
  const name = t ? nameOf(t) : "새 문서";
  $("#docpath").textContent = t?.store?.dir && t.path ? t.store.dir + "\\" + t.path.replace(/\//g, "\\") : t?.untitled ? "저장하지 않은 새 문서" : "";
  document.title = name + " - 새싹이의 농막";
  if (NATIVE) window.nm_setTitle(name);
}

function countChars() {
  const text = docText();
  $("#count").textContent = `${text.replace(/\s/g, "").length.toLocaleString("ko-KR")}자`;
}

// 고친 내용은 자동 저장하지 않는다(한글·워드처럼). 탭의 ●와 상태 줄이 "저장 안 됨"을 알리고, Ctrl+S로 저장한다.
function changed() {
  const t = cur();
  if (!t) return;
  if (!t.dirty) { t.dirty = true; renderTabs(); }
  countChars();
  status(t.store.kind === "single" ? "저장 안 됨 · Ctrl+S로 내려받기" : "저장 안 됨 · Ctrl+S");
}

async function save(t = cur()) {
  if (!t) return true;
  if (t.untitled) return saveAs();
  if (!t.path || !t.dirty) return true;
  const text = docText(t);
  try {
    await t.store.write(t.path, text);
    t.dirty = false;
    renderTabs();
    if (t === cur()) status("저장됨 · " + new Date().toLocaleTimeString("ko-KR", { hour: "2-digit", minute: "2-digit" }), "ok");
    return true;
  } catch (e) {
    status("저장 실패: " + e.message, "error");
    return false;
  }
}

/** 저장 안 된 문서를 닫기 전에 묻는다: 저장 / 저장 안 함 / 취소. 계속 진행해도 되면 true. */
async function askSave(t) {
  if (!t.dirty) return true;
  const answer = await ask(`"${nameOf(t)}" 문서에 저장하지 않은 내용이 있습니다. 저장할까요?`, ["저장", "저장 안 함", "취소"]);
  if (answer === "취소" || answer === null) return false;
  if (answer === "저장") return save(t);
  return true;
}

/** 화면 안 작은 대화상자. buttons 중 누른 글을 돌려준다(Esc·바깥 누름은 null). 첫 단추가 기본(Enter). */
function ask(message, buttons) {
  return new Promise((done) => {
    const back = el("div", "ask-back");
    const box = el("div", "ask");
    box.setAttribute("role", "dialog");
    box.append(el("p", "ask-msg", message));
    const row = el("div", "ask-row");
    const finish = (v) => { back.remove(); document.removeEventListener("keydown", onKey, true); done(v); };
    buttons.forEach((label, k) => {
      const b = el("button", "btn" + (k === 0 ? "" : " ghost"), label);
      b.onclick = () => finish(label);
      row.append(b);
    });
    const onKey = (ev) => { if (ev.key === "Escape") { ev.stopPropagation(); finish(null); } };
    document.addEventListener("keydown", onKey, true);
    box.append(row);
    back.append(box);
    back.onclick = (ev) => { if (ev.target === back) finish(null); };
    document.body.append(back);
    row.firstChild.focus();
  });
}

/** 창 닫기 요청(단추·Alt+F4·작업 표시줄): 저장 안 된 문서마다 묻고, 다 처리되면 진짜로 닫는다. */
async function requestClose() {
  for (const t of [...state.tabs]) {
    if (!t.dirty) continue;
    await activate(state.tabs.indexOf(t));
    if (!(await askSave(t))) return false;
  }
  if (NATIVE && window.nm_win) window.nm_win("close-now");
  return true;
}
window.nmRequestClose = requestClose;

function followLink(href) {
  if (/^(https?:|mailto:)/i.test(href)) {
    // 바깥 주소는 열지 않는다(내부망·보안). 주소를 복사해 주고 알린다.
    navigator.clipboard?.writeText(href).catch(() => {});
    status("바깥 주소는 열지 않습니다 - 주소를 복사했습니다: " + href);
    return;
  }
  if (href.startsWith("#")) return;
  const p = resolvePath(href);
  if (p && MD_EXT.test(p)) openPath(cur().store, p);
  else status("문서 링크(.md)만 열 수 있습니다: " + href, "error");
}

/** 그림 파일을 문서 폴더의 assets/에 저장하고 문서 기준 상대 경로를 돌려준다. */
async function storeImage(file, t = cur()) {
  if (file.size > 20 * 1024 * 1024) return status("그림이 20MB를 넘습니다.", "error"), null;
  if (t.untitled || !t.store || t.store.kind !== "native") return status("그림을 넣으려면 먼저 문서를 저장하세요(Ctrl+S) - 그림은 문서 옆 assets 폴더에 저장됩니다.", "error"), null;
  try {
    const ext = file.type.split("/")[1].replace("jpeg", "jpg");
    const name = new Date().toISOString().replace(/[-:T]/g, "").slice(0, 14) + "-" + Math.random().toString(36).slice(2, 6) + "." + ext;
    const saved = await t.store.saveAsset(name, file);
    const depth = (t.path || "").split("/").length - 1;
    return "../".repeat(depth) + saved;
  } catch (e) {
    status("그림을 저장하지 못했습니다: " + e.message, "error");
    return null;
  }
}

/* ---------------- 왼쪽 도구 막대 ---------------- */

const BLOCK_TYPES = [["p", "본문"], ["h1", "제목 1"], ["h2", "제목 2"], ["h3", "제목 3"], ["blockquote", "인용"], ["code", "코드"]];

/** 도구 막대의 켜짐 표시·표/그림 도구 보이기를 지금 선택에 맞춘다. */
function fmtState() {
  const t = cur();
  const st = t ? t.ed.state() : null;
  for (const b of document.querySelectorAll("#rail [data-cmd]")) b.classList.toggle("on", !!(st && st[b.dataset.cmd]));
  $("#f-tablebar").hidden = !(st && st.table);
  $("#f-imagebar").hidden = !(st && st.image);
  $("#f-block .lb").textContent = (BLOCK_TYPES.find(([v]) => v === (st ? st.block : "p")) || BLOCK_TYPES[0])[1];
  $("#f-undo").disabled = !(st && st.canUndo);
  $("#f-redo").disabled = !(st && st.canRedo);
}

function closePops() {
  document.querySelectorAll(".pop").forEach((p) => (p.hidden = true));
}

/** 설명 상자를 단추 오른쪽에 놓는다(도구 막대가 스크롤돼도 잘리지 않게 화면 기준 고정 위치). */
function placePop(pop) {
  const r = pop.parentElement.querySelector("button").getBoundingClientRect();
  pop.hidden = false;
  const h = pop.offsetHeight;
  pop.style.left = r.right + 6 + "px";
  pop.style.top = Math.max(8, Math.min(r.top, window.innerHeight - h - 8)) + "px";
}

/** 도구 막대 단추 옆에 펼쳐지는 목록. items: [값, 이름, 작은 글(선택)]. */
function showPop(id, items, onPick, current) {
  const pop = $("#" + id);
  const wasOpen = !pop.hidden;
  closePops();
  if (wasOpen) return;
  pop.textContent = "";
  for (const [value, name, hint] of items) {
    const row = el("button", "pi" + (value === current ? " on" : ""));
    row.type = "button";
    row.append(el("span", "", name));
    if (hint) row.append(el("small", "", hint));
    if (id === "pop-font" && value) row.firstChild.style.fontFamily = `"${value}"`;
    if (id === "pop-size" && value) row.firstChild.style.fontSize = value;
    row.onmousedown = (ev) => ev.preventDefault();
    row.onclick = () => { closePops(); onPick(value); };
    pop.append(row);
  }
  placePop(pop);
}

function drawPalette(id, colors, kind) {
  const pal = $("#" + id);
  pal.textContent = "";
  for (const c of colors) {
    const b = el("button");
    b.type = "button";
    b.title = c;
    b.style.background = c;
    b.onmousedown = (ev) => ev.preventDefault();
    b.onclick = () => { closePops(); cmd(kind, c); };
    pal.append(b);
  }
  const none = el("button", "none", kind === "color" ? "기본 색으로" : "형광펜 지우기");
  none.type = "button";
  none.onmousedown = (ev) => ev.preventDefault();
  none.onclick = () => { closePops(); cmd(kind, null); };
  pal.append(none);
}

/** 편집기 명령. 문서가 없으면 아무 일도 하지 않는다. */
function cmd(name, value) {
  const t = cur();
  if (!t) return;
  if (state.raw) return status("원문 모드에서는 서식 도구를 쓸 수 없습니다 - 편집기로 돌아가세요.");
  t.ed.cmd(name, value);
  fmtState();
}

function setupRail() {
  const rail = $("#rail");
  rail.addEventListener("mousedown", (ev) => { if (ev.target.closest("button")) ev.preventDefault(); }); // 단추를 눌러도 글의 선택이 풀리지 않게
  for (const b of rail.querySelectorAll("[data-cmd]")) b.onclick = () => { closePops(); cmd(b.dataset.cmd); };
  $("#f-undo").onclick = () => cmd("undo");
  $("#f-redo").onclick = () => cmd("redo");
  $("#f-block").onclick = () => showPop("pop-block", BLOCK_TYPES, (v) => cmd("block", v), cur()?.ed.state().block);
  const E = window.NMEditor;
  $("#f-font").onclick = () => showPop("pop-font", [[null, "기본 글꼴"], ...E.FONTS.map((f) => [f, f])], (v) => cmd("font", v));
  $("#f-size").onclick = () => showPop("pop-size", [[null, "기본 크기", "11pt"], ...E.SIZES.map((z) => [z, z])], (v) => cmd("size", v));
  drawPalette("pal-color", E.COLORS, "color");
  drawPalette("pal-bg", E.HILITES, "bg");
  const togglePal = (id) => { const p = $("#" + id); const show = p.hidden; closePops(); if (show) placePop(p); };
  $("#f-color").onclick = () => togglePal("pal-color");
  $("#f-bg").onclick = () => togglePal("pal-bg");
  document.addEventListener("click", (ev) => { if (!ev.target.closest(".rb-wrap")) closePops(); });
  $("#f-callout").onclick = () => showPop("pop-callout", Object.entries(E.CALLOUTS).map(([k, v]) => [k, v]), (v) => cmd("callout", v));
  $("#f-table").onclick = () => {
    const ans = prompt("표 크기 - 줄 수 × 칸 수 (머리 줄 포함)", "3 × 3");
    if (!ans) return;
    const nums = ans.match(/\d+/g) || [];
    cmd("table", { rows: Math.min(50, Math.max(2, Number(nums[0] || 3))), cols: Math.min(12, Math.max(1, Number(nums[1] || 3))) });
  };
  for (const op of ["rowAdd", "colAdd", "rowDel", "colDel", "tableDel", "headerRow"]) $("#f-" + op).onclick = () => cmd(op);
  for (const a of ["left", "center", "right"]) {
    $("#f-cell-" + a).onclick = () => cmd("cellAlign", a === "left" ? null : a);
    $("#f-img-" + a).onclick = () => cmd("imageAlign", a === "left" ? null : a);
  }
  $("#f-img-width").onclick = () => {
    const w = cur()?.ed.state().image?.width;
    const ans = prompt("그림 너비(px) - 비우면 원래 크기", w ? String(Math.round(w)) : "");
    if (ans === null) return;
    cmd("imageWidth", ans.trim() ? Math.max(40, Number(ans.replace(/\D/g, "")) || 40) : null);
  };
  $("#f-img-alt").onclick = () => {
    const alt = cur()?.ed.state().image?.alt || "";
    const ans = prompt("그림 설명(대체 글)", alt);
    if (ans !== null) cmd("imageAlt", ans.trim());
  };
  $("#f-img-del").onclick = () => cmd("imageDel");
  $("#f-image").onclick = () => cmd("image");
  $("#f-link").onclick = () => cmd("link");
  $("#f-break").onclick = () => cmd("pagebreak");
  $("#f-hr").onclick = () => cmd("hr");
  $("#f-up").onclick = () => cmd("moveUp");
  $("#f-down").onclick = () => cmd("moveDown");
  $("#f-clear").onclick = () => cmd("clear");
  $("#mode-rich").onclick = () => setRaw(false);
  $("#mode-raw").onclick = () => setRaw(true);
}

/* ---------------- 원문 보기 ---------------- */

function setRaw(on) {
  const t = cur();
  if (!t || state.raw === on) return;
  if (on) $("#raw").value = t.ed.getMarkdown();
  else t.ed.setMarkdown($("#raw").value);
  state.raw = on;
  $("#raw-wrap").hidden = !on;
  $("#editors").hidden = on;
  $("#mode-rich").classList.toggle("on", !on);
  $("#mode-raw").classList.toggle("on", on);
  $("#rail").classList.toggle("off", on);
  if (on) autosize($("#raw"));
}

function autosize(ta) {
  ta.style.height = "auto";
  ta.style.height = ta.scrollHeight + 2 + "px";
}

/* ---------------- 인쇄: 마크다운을 쪽으로 그려서(화면 해석기) 인쇄한다 ---------------- */

/* 쪽: A4(210×297mm), 여백 좌우 20mm·위아래 30mm. 블록을 차례로 쪽에 담다가 넘치면 다음 쪽으로 넘긴다.
   <!-- pagebreak --> 뒤는 무조건 새 쪽. 표·목록이 쪽을 넘치면 줄(tr)·항목(li) 단위로 잘라 다음 쪽에 잇는다(표는 머리 줄 반복). */
function newSheet(doc) {
  const sheet = el("section", "sheet");
  const body = el("div", "sheet-body");
  const no = el("div", "sheet-no");
  sheet.append(body, no);
  doc.append(sheet);
  return body;
}

function applyStyles(root) {
  for (const s of root.querySelectorAll(".st")) {
    const d = s.dataset;
    if (d.color) s.style.color = d.color;
    if (d.bg) s.style.backgroundColor = d.bg;
    if (d.font) s.style.fontFamily = `"${d.font}"`;
    if (d.size) s.style.fontSize = d.size;
  }
}

function printBlock(md, i) {
  const wrap = el("div", "block");
  wrap.dataset.i = i;
  const body = el("div", "block-body");
  body.innerHTML = MD.renderBlock(md); // MD.renderBlock은 원문을 전부 이스케이프한다(markdown.js 머리말)
  applyStyles(body);
  wrap.append(body);
  return wrap;
}

function topIn(e, ancestor) {
  let top = 0;
  for (; e && e !== ancestor; e = e.offsetParent) top += e.offsetTop;
  return top;
}

/** 넘친 블록을 자른다: 들어가는 줄까지만 남기고 나머지(와 그 뒤 내용)를 이어 붙일 조각으로 돌려준다. 못 자르면 null. */
function splitBlock(wrap, sheetBody, limit) {
  const target = wrap.querySelector(":scope > .block-body > table, :scope > .block-body > ul, :scope > .block-body > ol");
  if (!target) return null;
  const isTable = target.tagName === "TABLE";
  const rows = isTable ? [...target.querySelectorAll(":scope > tbody > tr")] : [...target.children];
  const over = rows.findIndex((r) => topIn(r, sheetBody) + r.offsetHeight > limit);
  if (over < 1) return null; // 첫 줄부터 안 들어가면 통째로 다음 쪽으로
  const cont = el("div", "block cont");
  const body = el("div", "block-body");
  const shell = target.cloneNode(false);
  if (isTable) {
    const thead = target.querySelector(":scope > thead");
    if (thead) shell.append(thead.cloneNode(true));
    const tbody = el("tbody");
    tbody.append(...rows.slice(over));
    shell.append(tbody);
  } else {
    shell.append(...rows.slice(over));
    if (shell.tagName === "OL") shell.start = Number(target.getAttribute("start") || 1) + over;
  }
  body.append(shell);
  while (target.nextSibling) body.append(target.nextSibling);
  applyStyles(body);
  cont.append(body);
  return cont;
}

async function buildPrintDoc(md, t, doc = $("#print-doc")) {
  doc.textContent = "";
  const blocks = MD.splitBlocks(md).map((b, i) => printBlock(b, i));
  // 그림을 먼저 넣는다(높이를 재야 하니까)
  for (const b of blocks) {
    for (const img of b.querySelectorAll("img[data-src]")) {
      const rel = resolvePath(img.dataset.src, t);
      try { img.src = rel ? await t.store.imageUrl(rel) : ""; } catch { img.replaceWith(el("span", "blocked", `[그림 없음: ${img.dataset.src}]`)); }
    }
  }
  doc.hidden = false;
  let body = newSheet(doc);
  const limit = () => body.clientHeight;
  const overflow = (b) => b.offsetTop + b.offsetHeight > limit();
  const queue = blocks;
  for (let k = 0; k < queue.length; k++) {
    const b = queue[k];
    body.append(b);
    if (overflow(b)) {
      let cont = splitBlock(b, body, limit());
      if (!cont && body.childElementCount > 1) {
        b.remove();
        body = newSheet(doc);
        body.append(b);
        if (overflow(b)) cont = splitBlock(b, body, limit());
      }
      if (cont) queue.splice(k + 1, 0, cont);
    }
    if (b.querySelector("[data-pagebreak]")) body = newSheet(doc);
  }
  doc.querySelectorAll(".sheet").forEach((sh, n) => (sh.querySelector(".sheet-no").textContent = `- ${n + 1} -`));
}

async function printDoc(pdfHint) {
  const t = cur();
  if (!t) return;
  await buildPrintDoc(docText(), t);
  document.body.classList.add("printing");
  if (pdfHint) status("인쇄 창의 '프린터'에서 'PDF로 저장'(또는 Microsoft Print to PDF)을 고르세요.");
  const done = () => { document.body.classList.remove("printing"); $("#print-doc").hidden = true; $("#print-doc").textContent = ""; window.removeEventListener("afterprint", done); };
  window.addEventListener("afterprint", done);
  setTimeout(() => window.print(), 50);
}

/* ---------------- 내보내기: 한글(hwpx) ---------------- */

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToB64(bytes) {
  let bin = "";
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

/** 그림 바이트(한글 문서에 넣을 것). 문서 기준 상대 경로 → 폴더 안 그림만. */
async function imageBytes(src) {
  const img = MD_SAFE_IMAGE(src);
  if (!img) return null;
  if (img.kind === "data") return b64ToBytes(img.src.split(",")[1].replace(/\s/g, ""));
  const t = cur();
  const rel = resolvePath(img.src, t);
  if (!rel || !t?.store) return null;
  const url = await t.store.imageUrl(rel);
  return url.startsWith("data:") ? b64ToBytes(url.split(",")[1]) : null;
}

async function saveBytes(bytes, name, ext) {
  if (NATIVE) {
    const where = await window.nm_saveBytes(name + "." + ext, ext, bytesToB64(bytes));
    if (where) status(`${ext.toUpperCase()}로 저장했습니다: ${where}`, "ok");
    return;
  }
  const a = el("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
  a.download = name + "." + ext;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

async function exportHwpx() {
  const t = cur();
  if (!t) return;
  status("한글 문서를 만드는 중…");
  try {
    const bytes = await HWPX.build(docText(), { template: HWPX_TEMPLATE, title: nameOf(t), readImage: imageBytes });
    await saveBytes(bytes, nameOf(t), "hwpx");
  } catch (e) {
    status("한글 문서로 내보내지 못했습니다: " + (e.message || e), "error");
  }
}

/* ---------------- 파일 메뉴 (한글·워드처럼) ---------------- */

async function newDocument() {
  const t = await addTab({ store: singleStore("새 문서.md", ""), path: null, untitled: true }, "# 새 문서\n\n");
  t.ed.editor.commands.focus("end");
}

async function saveAs() {
  const t = cur();
  if (!t) return false;
  const name = nameOf(t);
  if (NATIVE) {
    try {
      const info = await window.nm_saveAs(name + ".md", docText(t));
      if (!info || !info.root) return false; // 취소
      t.store = nativeStore(info);
      t.path = info.open;
      t.untitled = false;
      t.dirty = false;
      renderTabs();
      setDocTitle();
      rememberRecent(t.store, t.path);
      status("저장됨", "ok");
      return true;
    } catch (e) {
      status("저장하지 못했습니다: " + e, "error");
      return false;
    }
  }
  const a = el("a"); // 브라우저: 내려받기
  a.href = URL.createObjectURL(new Blob([docText(t)], { type: "text/markdown;charset=utf-8" }));
  a.download = name + ".md";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  t.dirty = false;
  renderTabs();
  return true;
}

async function openDialog() {
  if (!NATIVE) return openSingle();
  try {
    const info = await window.nm_openFile();
    if (info && info.root) await openPath(nativeStore(info), info.open);
  } catch (e) {
    status("열지 못했습니다: " + e, "error");
  }
}

function openSingle() {
  const input = el("input");
  input.type = "file";
  input.accept = ".md,.markdown,text/markdown,text/plain";
  input.onchange = async () => {
    const f = input.files[0];
    if (!f) return;
    await openPath(singleStore(f.name, await f.text()), f.name);
  };
  input.click();
}

function toggleMenu(force) {
  const menu = $("#filemenu");
  const open = force ?? menu.hidden;
  menu.hidden = !open;
  $("#btn-file").classList.toggle("on", open);
}

/* ---------------- 창 제목 줄(탭 줄) - 프로그램 창에는 시스템 제목 줄이 없다 ---------------- */

function setupTitlebar() {
  if (!window.NONGMAK_FRAMELESS || !window.nm_win) return;
  $("#wincmd").hidden = false;
  const win = (cmd) => window.nm_win(cmd).then(syncMax).catch(() => {});
  const syncMax = (zoomed) => {
    $("#app").classList.toggle("maximized", !!zoomed);
    $("#win-max").title = zoomed ? "이전 크기로" : "최대화";
    $("#win-max").firstElementChild.innerHTML = zoomed
      ? '<rect x="2.5" y=".5" width="7" height="7" fill="none" stroke="currentColor" stroke-width="1"/><rect x=".5" y="2.5" width="7" height="7" fill="var(--cream)" stroke="currentColor" stroke-width="1"/>'
      : '<rect x=".5" y=".5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1"/>';
  };
  // 끌기는 창의 끌기 루프가 마우스를 가져가 dblclick 이벤트가 오지 않는다 - 두 번째 누름을 직접 알아본다
  let last = { t: 0, x: 0, y: 0 };
  const drag = (ev) => {
    if (ev.button !== 0) return;
    ev.preventDefault();
    const now = Date.now();
    const twice = now - last.t < 450 && Math.abs(ev.clientX - last.x) < 6 && Math.abs(ev.clientY - last.y) < 6;
    last = { t: twice ? 0 : now, x: ev.clientX, y: ev.clientY };
    win(twice ? "max" : "drag");
  };
  $("#tabs-drag").addEventListener("mousedown", drag);
  $("#tabs").addEventListener("mousedown", (ev) => { if (ev.target === $("#tabs")) drag(ev); });
  $("#win-min").onclick = () => win("min");
  $("#win-max").onclick = () => win("max");
  $("#win-close").onclick = () => requestClose();
  // 위쪽 가장자리 5px: 창 높이 조절(제목 줄이 없어진 자리의 크기 조절 테두리 노릇)
  const edge = el("div", "resize-top");
  document.body.append(edge);
  edge.addEventListener("mousedown", (ev) => { if (ev.button !== 0) return; ev.preventDefault(); const w = window.innerWidth; win(ev.clientX < 8 ? "resize-top-left" : ev.clientX > w - 8 ? "resize-top-right" : "resize-top"); });
  window.addEventListener("resize", () => win("state"));
  win("state");
}

/* ---------------- 보기 ---------------- */

// 60% 이하로 줄이면 쪽을 나란히 놓는 미리보기(읽기 전용)로 바뀐다 - 편집기는 한 흐름이라 쪽을 옆으로 세울 수 없어서,
// 인쇄에 쓰는 쪽 그리기(표는 줄 단위로 잘림)로 보여 준다. 쪽을 누르면 100%로 돌아와 다시 고친다.
const PREVIEW_ZOOM = 0.6;

async function setZoom(z) {
  state.zoom = Math.round(Math.min(2, Math.max(0.3, z)) * 10) / 10;
  $("#editors").style.zoom = state.zoom;
  $("#raw-wrap").style.zoom = state.zoom;
  $("#preview").style.zoom = state.zoom;
  $("#zoom-val").textContent = Math.round(state.zoom * 100) + "%";
  const preview = state.zoom <= PREVIEW_ZOOM && !state.raw && state.pages && cur();
  if (preview) {
    const t = cur();
    if (state.previewFor !== t || state.previewText !== docText()) {
      state.previewFor = t;
      state.previewText = docText();
      await buildPrintDoc(state.previewText, t, $("#preview"));
    }
    status("쪽 미리보기(읽기 전용) · 쪽을 누르거나 Ctrl+0을 누르면 편집으로 돌아갑니다");
  } else state.previewFor = null;
  $("#preview").hidden = !preview;
  $("#editors").hidden = !!preview || state.raw;
  $("#rail").classList.toggle("off", !!preview || state.raw);
  if (!preview && cur()) setDocTitle(), fmtState();
}

function setPages(on) {
  state.pages = on;
  $("#btn-pages").classList.toggle("on", on);
  $("#btn-pages").title = on ? "쪽 나눔 보기 끄기(이어지는 한 장으로)" : "쪽 나눔 보기 켜기(A4 쪽으로)";
  for (const t of state.tabs) t.ed.setPages(on);
  try { localStorage.setItem("nongmak.pages", on ? "1" : "0"); } catch { /* 무시 */ }
  setZoom(state.zoom);
}

function toggleSide(open) {
  // 왼쪽 도구 막대: 접으면 아이콘만, 펴면 이름도
  const app = $("#app");
  const show = open ?? !app.classList.contains("rail-open");
  app.classList.toggle("rail-open", show);
  $("#btn-side").classList.toggle("on", show);
  try { localStorage.setItem("nongmak.rail", show ? "1" : "0"); } catch { /* 무시 */ }
}

function setTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("#btn-theme").textContent = theme === "dark" ? "밝게" : "어둡게";
  try { localStorage.setItem("nongmak.theme", theme); } catch { /* 무시 */ }
}

/* ---------------- 시작 ---------------- */

async function start() {
  try {
    const t = localStorage.getItem("nongmak.theme");
    if (t) document.documentElement.dataset.theme = t;
  } catch { /* 무시 */ }
  $("#btn-file").onclick = (ev) => {
    ev.stopPropagation();
    toggleMenu();
  };
  document.addEventListener("click", () => toggleMenu(false));
  const menu = {
    "m-new": newDocument, "m-open": openDialog,
    "m-save": () => { const t = cur(); if (t) { t.dirty = true; save(t); } }, "m-saveas": saveAs,
    "m-hwpx": exportHwpx, "m-pdf": () => printDoc(true), "m-print": () => printDoc(false),
    "m-close": () => closeTab(state.tab),
  };
  for (const [id, fn] of Object.entries(menu)) $("#" + id).onclick = () => { toggleMenu(false); fn(); };
  $("#tab-add").onclick = newDocument;
  $("#w-new").onclick = newDocument;
  $("#w-file").onclick = openDialog;
  setupTitlebar();
  setupRail();
  $("#btn-theme").onclick = () => setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
  $("#btn-pages").onclick = () => setPages(!state.pages);
  try { if (localStorage.getItem("nongmak.pages") === "0") { state.pages = false; $("#btn-pages").classList.remove("on"); $("#btn-pages").title = "쪽 나눔 보기 켜기(A4 쪽으로)"; } } catch { /* 무시 */ }
  $("#raw").oninput = () => {
    autosize($("#raw"));
    changed();
  };
  // 확대·축소: 문서 위에서 Ctrl+휠, Ctrl+0은 100%
  $(".desk").addEventListener("wheel", (ev) => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    setZoom(state.zoom + (ev.deltaY < 0 ? 0.1 : -0.1));
  }, { passive: false });
  $("#preview").addEventListener("click", () => { setZoom(1); cur()?.ed.focus(); });
  $("#zoom-in").onclick = () => setZoom(state.zoom + 0.1);
  $("#zoom-out").onclick = () => setZoom(state.zoom - 0.1);
  $("#zoom-val").onclick = () => setZoom(1);
  $("#btn-side").onclick = () => toggleSide();
  try { if (localStorage.getItem("nongmak.rail") === "1") toggleSide(true); } catch { /* 무시 */ }
  document.addEventListener("keydown", (ev) => {
    if (!(ev.ctrlKey || ev.metaKey)) return;
    const k = ev.key.toLowerCase();
    if (k === "s") {
      ev.preventDefault();
      if (ev.shiftKey) return void saveAs();
      const t = cur();
      if (t) { t.dirty = true; save(t); }
    } else if (k === "o") {
      ev.preventDefault();
      openDialog();
    } else if (k === "n") {
      ev.preventDefault();
      newDocument();
    } else if (k === "w") {
      ev.preventDefault();
      closeTab(state.tab);
    } else if (k === "tab" && state.tabs.length > 1) {
      ev.preventDefault();
      activate((state.tab + (ev.shiftKey ? -1 : 1) + state.tabs.length) % state.tabs.length);
    } else if (k === "p") {
      ev.preventDefault();
      printDoc(false);
    } else if (k === "0") {
      ev.preventDefault();
      setZoom(1);
    }
  });
  window.addEventListener("beforeunload", (ev) => { // 브라우저 판: 프로그램 창은 nmRequestClose가 묻는다
    if (!NATIVE && state.tabs.some((t) => t.dirty)) {
      ev.preventDefault();
      ev.returnValue = "";
    }
  });

  if (NATIVE) {
    const info = await window.nm_info();
    if (info && info.root && info.open) {
      await openPath(nativeStore(info), info.open);
      return;
    }
  }
  showHome(true); // 열 문서가 없으면 대문
}

start();
